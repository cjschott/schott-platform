# Generation-6 host prerequisite for ENG-0005 Pass 4B.
#
# NOT INSTALLED BY ANYTHING IN THIS REPOSITORY. An operator copies this to
# /etc/tmpfiles.d/ as part of the generation-6 installation ceremony, and not
# before: the runtime that uses this root is generation-6 source.
#
# WHY IT EXISTS. Podman bind-mounts the worker's invocation snapshot, and a
# bind mount exposes its source for the container's whole lifetime. The
# snapshot therefore has to live where the coordinator cannot write, traverse,
# rename, or chmod it. /run is the only root-owned ancestry on this host.
#
# WHY 0770 AND NOT 0775. cschott and kyri-capability share no group, so group
# ownership admits the execution identity and excludes the coordinator
# completely -- no write, no read, and no traverse, so it cannot even enumerate
# which invocations exist. Verify before provisioning:
#
#   id -nG cschott | tr ' ' '\n' | grep -x kyri-capability   # must find nothing
#   namei -l /run/kyri/execution-material                    # ancestry root-owned
#
# NO AGE FIELD, DELIBERATELY. A snapshot must survive for the whole container
# lifetime, and systemd-tmpfiles cleaning on a timer would remove live
# execution material out from under a running container. The worker owns
# removal; nothing here sweeps.
#
# /run is tmpfs, so these are cleared on reboot. That is correct: snapshots are
# ephemeral execution material, durable evidence lives elsewhere, and losing
# them revokes no implementation authority.
#
# Governed by docs/superpowers/specs/2026-08-11-first-adapter-design.md §14.5.

d /run/kyri 0755 root root -
d /run/kyri/execution-material 0770 root kyri-capability -
