---
# Declarative schema for capability contracts.
#
# A contract is the versioned, testable interface a capability is reached
# through. Version negotiation happens against contracts, never against
# packages, so that changing the implementation of a capability is not the same
# event as changing the way it is called.
#
# Human-declared, so identifiers are four digits.
#
# ARCHITECTURE ONLY. No runtime writes these records in this release.
#
# Governed by: docs/decisions/ADR-0012-distributed-capability-fabric.md

api_version: schott-platform/v1
kind: Schema
schema_for: capability-contract

provenance:
  class: declared
  source: docs/decisions/ADR-0012-distributed-capability-fabric.md
  recorded_at: 2026-08-03
  last_reviewed: 2026-08-03

id_pattern: '^CCON-[0-9]{4}$'

mutability: immutable
update_methods: none
delete_methods: none
supersession: new-record-only

required_fields:
  - contract_id
  - capability_id
  - contract_version
  - effect_class
  - request_shape
  - response_shape
  - failure_modes
  - determinism_class
  # The resources the interface itself requires, in the host resource-profile
  # vocabulary. A package may declare more for its own implementation; it may
  # never declare less than its contract. Enforced at package declaration --
  # see `package_requirement_relation` on capability-package.
  - resource_requirements
  # Explicit list of prior contract versions this one is compatible with.
  # Empty means compatible with nothing, which is a valid and honest answer.
  - compatible_with
  - provenance

optional_fields:
  - description
  - supersedes
  - superseded_by
  - notes

# Compatibility is reviewed by a human and written down. The platform never
# reads meaning into a version number: semantic versioning is a convention
# publishers follow imperfectly, and treating it as a guarantee means an
# upgrade decision is made by string comparison.
version_compatibility: declared-only
version_inference: forbidden
negotiation: exact-set-intersection
on_empty_intersection: refuse

# A contract describes an interface, not a machine. Binding one to a host would
# make the interface unrepeatable anywhere else, which is the property the
# whole identity model depends on.
host_bound: false

enums:
  effect_class:
    # What the capability changes, which is the axis governance cares about.
    # Separated from determinism because a deterministic capability can still
    # change the world, and a nondeterministic one need not.
    - read-only            # observes; changes nothing
    - computational        # computes; changes nothing outside the request
    - content-generating   # produces new content; changes nothing outside the request
    - side-effecting       # changes state outside the request
  determinism_class:
    - deterministic
    - bounded-nondeterministic
    - nondeterministic
  failure_mode:
    # The observable ways a call through this interface can fail, and the
    # closed set a contract may declare. Closed because `failure_modes` is
    # permanent and immutable: a mode spelled freely is a promise no reader can
    # interpret and no implementation can be held to, and it is kept forever.
    #
    # Success is not a failure mode, so `completed` is absent. Nothing here
    # names a provider, a vendor, an internal refusal category, or an
    # implementation classification: those are the platform's private
    # vocabulary and would bind a permanent contract to a build.
    - refused                  # the call was declined; no work was attempted
    - adapter-error            # the interface could not be reached or served
    - timeout                  # a bound elapsed before the call concluded
    - interrupted              # the call was stopped after it began
    - serialisation-failure    # a result existed but could not be represented
    # Its own outcome, never folded into `serialisation-failure`. A missing
    # result and an unrepresentable one are observably different conditions,
    # and the difference is what tells an operator whether anything ran.
    - result-missing           # the call concluded and produced no result

# --- shapes are references, never copies ------------------------------------
#
# `request_shape` and `response_shape` name the authority that enforces the
# shape. They do not restate it. A contract that spelled the fields out would
# be a second, permanent, unexecuted copy of a schema some module already
# enforces, and the day the two disagree the contract wins by being immutable
# while the code wins by being what actually runs.
#
# So a shape carries exactly three things: which module enforces it, which
# schema that module implements, and which version of it. Whether the named
# authority is correct is a review question, exactly as it is for a package's
# `artifact_reference`; that the contract claims exactly one is a governed one.
shape_form: authority-reference
inline_shape_declaration: forbidden

shape_reference_fields:
  - authority        # repository path of the module that enforces the shape
  - schema           # the schema name that module implements
  - schema_version   # which version of it, as a positive integer

# Closed: a reference carrying a fourth key is refused rather than ignored,
# because an ignored key in an immutable record is a claim nobody reviewed.
shape_reference_form: closed

# One request, one enforcing authority.
request_shape_form: single-reference

# A result has two independently enforced layers, and one authority does not
# enforce both. The envelope is the transport-level document -- that it exists,
# that it parses, that it is within bounds. The content is what the capability
# actually returned. Naming them separately keeps each claim attached to the
# code that performs it.
response_shape_parts:
  - envelope
  - content

# A side-effecting contract is representable so that a future actuating
# capability has somewhere to be described. It is not routable: admitting
# actuation under governance written for text generation is how a capability
# fabric becomes an autonomous controller. Opening this requires a future ADR.
routable_effect_classes:
  - read-only
  - computational
  - content-generating

# No route and no selection may override the prohibition. If the restriction
# could be lifted per-route, it would be lifted during an incident.
effect_class_override: forbidden

forbidden_fields:
  - capability_host_id
  - instance_id
  - trust_state
  - health_state
  - auto_upgrade
  - auto_downgrade
  - nearest_match
  - best_effort
  - command
