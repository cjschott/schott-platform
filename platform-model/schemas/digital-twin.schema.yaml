---
# Declarative schema for disposable digital twins.
#
# A twin is a working reconstruction of current state, rebuilt entirely from
# knowledge and never edited directly. It describes the shape of a derived
# artefact so consumers can rely on it — not a record the repository stores.
#
# Governed by: docs/decisions/ADR-0007-operational-integrity-engine.md

api_version: schott-platform/v1
kind: Schema
schema_for: digital-twin

provenance:
  class: declared
  source: docs/decisions/ADR-0007-operational-integrity-engine.md
  recorded_at: 2026-08-02
  last_reviewed: 2026-08-02

id_pattern: '^TWIN-[0-9]{6}$'

required_fields:
  - id
  - type
  - target
  - built_at
  - facts
  - content_fingerprint
  - disposable
  - provenance

constant_fields:
  type: digital-twin
  disposable: true

entity_reference_fields:
  - target

evidence_reference_fields:
  - supporting_evidence

enums:
  knowledge_freshness:
    - current
    - aging
    - stale
    - unknown
  provenance_class:
    - derived

timestamp_fields:
  - built_at

# Disposability is the design. A twin rebuilt from immutable inputs makes a
# reconstruction bug a code bug that a rerun fixes, rather than corrupted state
# somebody has to repair by hand.
persistence:
  stored: false
  rationale: >-
    A persisted twin is indistinguishable from a snapshot at a glance, and the
    difference between "confirmed good" and "reconstructed just now" is the
    entire point.

forbidden_secret_keys:
  - password
  - passwd
  - api_key
  - apikey
  - secret_key
  - master_key
  - private_key
  - access_token
  - bearer_token
  - session_cookie
  - authorization
  - auth_header
  - credentials
  - token

permitted_secret_metadata_keys:
  - secret_present
  - secret_source
  - secret_length_class
  - secret_last_rotated

# A record read by tooling must never be able to cause an action when parsed.
forbidden_fields:
  - remediation_command
  - remediation_action
  - fix_command
  - apply_command
  - execute_command
  - script
  - raw_output
