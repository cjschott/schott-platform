---
# Declarative schema for timelines.
#
# An ordered view of occurrences for a target, across kinds.
#
# Governed by: docs/decisions/ADR-0009-occurrence-timeline.md

api_version: schott-platform/v1
kind: Schema
schema_for: timeline

provenance:
  class: declared
  source: docs/decisions/ADR-0009-occurrence-timeline.md
  recorded_at: 2026-08-02
  last_reviewed: 2026-08-02

id_pattern: '^TL-[0-9]{6}$'

required_fields:
  - id
  - type
  - target
  - generated_at
  - entry_count
  - provenance

constant_fields:
  type: timeline

entity_reference_fields:
  - target

enums:
  provenance_class:
    - derived

timestamp_fields:
  - generated_at

nullable_temporal_fields:
  - earliest
  - latest
  - span_seconds

# Ordering is by occurred_at then identifier. The tiebreak is required, not
# cosmetic: occurrences frequently share an instant, and without it two reads
# of the same history would disagree about their order.
ordering:
  primary: occurred_at
  tiebreak: id
  deterministic: true

forbidden_secret_keys:
  - password
  - passwd
  - api_key
  - apikey
  - secret_key
  - master_key
  - private_key
  - access_token
  - bearer_token
  - session_cookie
  - authorization
  - auth_header
  - credentials
  - token

permitted_secret_metadata_keys:
  - secret_present
  - secret_source
  - secret_length_class
  - secret_last_rotated

# A record read by tooling must never cause an action when parsed, and must
# never carry a claim about the future.
forbidden_fields:
  - remediation_command
  - remediation_action
  - fix_command
  - apply_command
  - execute_command
  - prediction
  - forecast
  - next_occurrence_at
  - expected_next
  - probability
  - raw_output
