---
# Declarative schema for capability selections.
#
# One recorded act of choosing. This is the record that answers "why did this
# run there?" without reconstructing anything from logs, which is the question
# a distributed system becomes unreviewable without.
#
# It records every candidate considered and the exclusion reason for each one
# rejected. A selection that recorded only the winner would document the
# outcome while hiding the decision.
#
# Machine-generated, so identifiers are six digits.
#
# ARCHITECTURE ONLY. No runtime writes these records in this release.
#
# Governed by: docs/decisions/ADR-0012-distributed-capability-fabric.md

api_version: schott-platform/v1
kind: Schema
schema_for: capability-selection

provenance:
  class: declared
  source: docs/decisions/ADR-0012-distributed-capability-fabric.md
  recorded_at: 2026-08-03
  last_reviewed: 2026-08-03

id_pattern: '^CSEL-[0-9]{6}$'

mutability: immutable
update_methods: none
delete_methods: none
supersession: new-record-only
append_only_history: true

record_class: audit
records_exclusion_reason: true

# A selection points at the policy that governed it and does not carry a copy.
# A copy would drift from the route, and the audit record would then describe a
# policy that never applied — which is worse than no record, because it reads
# as authoritative.
references_governing_route: true
duplicates_route_policy: false

required_fields:
  - selection_id
  - request_class
  - considered_candidates
  - excluded_candidates
  # Null is a valid value and means the fabric refused. A refusal is an
  # outcome, and it is recorded exactly like a selection.
  - selected_instance_id
  - selection_reason
  - selected_at
  - provenance

# Route provenance is required of every decision a route governed, and absent
# from the one decision no route governed. A request class with no resolvable
# route is still a durable outcome -- silence is not an outcome -- but there is
# no route identity to name, and inventing one would cite a record that does
# not exist.
conditionally_required_fields:
  - route_id
  # The route version that applied at the moment of selection, so a later route
  # edit cannot change the explanation of a past choice.
  - route_version

optional_fields:
  - refusal_reason
  # The Fabric node that constituted "this host" when locality was evaluated.
  # Recorded so a `local-only` decision can be reconstructed: the same request
  # evaluated on a different node is a different decision, and a record that
  # did not say which node governed it could not tell them apart.
  - local_node_identity
  - notes

# All-or-none. A record naming a route version without a route, or a route
# without the version that applied, describes a policy nobody can look up.
route_provenance: all-or-none
# Absent only for the outcome that had no route. A selected instance always
# came from a route, and so did every candidate any route governed.
route_provenance_absent_only_for: no-candidate
route_identity_placeholder: forbidden

# A refusal is written down. Silence is not an outcome.
records_refusal: true

# The selection record describes a decision. It is not a transcript: prompts,
# payloads, and responses are never written here.
forbidden_fields:
  - prompt
  - prompt_content
  - request_payload
  - response_payload
  - response_content
  - trust_score
  - health_score
  - token
  - secret
  - credential
  - command
