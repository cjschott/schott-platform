---
# Declarative schema for capability selections.
#
# One recorded act of choosing. This is the record that answers "why did this
# run there?" without reconstructing anything from logs, which is the question
# a distributed system becomes unreviewable without.
#
# It records every candidate considered and the exclusion reason for each one
# rejected. A selection that recorded only the winner would document the
# outcome while hiding the decision.
#
# Machine-generated, so identifiers are six digits.
#
# ARCHITECTURE ONLY. No runtime writes these records in this release.
#
# Governed by: docs/decisions/ADR-0012-distributed-capability-fabric.md

api_version: schott-platform/v1
kind: Schema
schema_for: capability-selection

provenance:
  class: declared
  source: docs/decisions/ADR-0012-distributed-capability-fabric.md
  recorded_at: 2026-08-03
  last_reviewed: 2026-08-03

id_pattern: '^CSEL-[0-9]{6}$'

mutability: immutable
update_methods: none
delete_methods: none
supersession: new-record-only
append_only_history: true

record_class: audit
records_exclusion_reason: true

# A selection points at the policy that governed it and does not carry a copy.
# A copy would drift from the route, and the audit record would then describe a
# policy that never applied — which is worse than no record, because it reads
# as authoritative.
references_governing_route: true
duplicates_route_policy: false

required_fields:
  - selection_id
  - request_class
  - considered_candidates
  - excluded_candidates
  # Null is a valid value and means the fabric refused. A refusal is an
  # outcome, and it is recorded exactly like a selection.
  - selected_instance_id
  - selection_reason
  - selected_at
  - provenance

# Route provenance is required of every decision a route governed, and absent
# from the one decision no route governed. A request class with no resolvable
# route is still a durable outcome -- silence is not an outcome -- but there is
# no route identity to name, and inventing one would cite a record that does
# not exist.
conditionally_required_fields:
  - route_id
  # The route version that applied at the moment of selection, so a later route
  # edit cannot change the explanation of a past choice.
  - route_version
  # HEALTH DISCLOSURE. Required on every selection from the forward boundary
  # declared below. ADR-0013 requires that health never silently disappear from
  # the explanation, and the released record could not tell three different
  # facts apart: health not consulted, health consulted and silent, and health
  # consulted and agreeing. All three ended with no removal and were byte-
  # identical.
  - health_disclosure
  # Per-candidate, for EVERY considered candidate including the selected one.
  # A single subject-level health field cannot express several candidates in
  # different states, and the released record gave an entry only to EXCLUDED
  # candidates -- so a winner about which health said nothing was
  # indistinguishable from one health endorsed.
  - candidate_health

optional_fields:
  - refusal_reason
  # The Fabric node that constituted "this host" when locality was evaluated.
  # Recorded so a `local-only` decision can be reconstructed: the same request
  # evaluated on a different node is a different decision, and a record that
  # did not say which node governed it could not tell them apart.
  - local_node_identity
  - notes

# All-or-none. A record naming a route version without a route, or a route
# without the version that applied, describes a policy nobody can look up.
route_provenance: all-or-none
# Absent only for the outcome that had no route. A selected instance always
# came from a route, and so did every candidate any route governed.
route_provenance_absent_only_for: no-candidate
route_identity_placeholder: forbidden

# A refusal is written down. Silence is not an outcome.
records_refusal: true

# ===========================================================================
# THE FORWARD DISCLOSURE BOUNDARY
# ===========================================================================
#
# The problem: health disclosure must be MANDATORY for every new selection,
# while five immutable records written before it existed must stay valid,
# unchanged and uninterpreted.
#
# WHY NOT schema_version. The Fabric's schema_version is a SINGLE GLOBAL value
# shared by all eight record families and enforced by equality -- a stored
# record declaring a different one is refused outright. Moving it to make
# disclosure mandatory here would invalidate every capability-definition,
# contract, package, host, advertisement, instance, route and selection record
# in existence. That is a migration by rewrite of the whole store, and the
# global version is therefore NOT TOUCHED by this boundary.
#
# WHY NOT optional fields. Optional-and-absent IS the silent case, so a
# conforming writer could still say nothing about health and pass.
#
# THE MECHANISM: a CLOSED set of pre-disclosure identities.
#
# Selection identities are allocated from a monotonic sequence under an
# exclusive lock, and the sequence refuses rollover rather than reusing a name.
# So every identity a new write can receive is strictly greater than every
# identity in the closed set below, and A NEW WRITE CAN NEVER JOIN IT. Omitting
# the disclosure fields cannot make a new record look like a legacy one,
# because membership is decided by identity rather than by shape.
#
# A record IN the closed set may omit disclosure and is read as what it is: a
# selection made when no Health runtime existed. It is NOT read as
# "consulted: false" and NOT assigned a default health state -- both would be
# this runtime asserting something about a decision taken before the field
# existed.
#
# A record NOT in the closed set MUST carry disclosure, on write and on read.
#
# Nothing is ever written back into an older record.
health_disclosure_boundary:
  set: closed
  pre_disclosure_selection_ids:
    - CSEL-000001
    - CSEL-000002
    - CSEL-000003
    - CSEL-000004
    - CSEL-000005
  disclosure_required_from: CSEL-000006
  global_schema_version_changed: false
  legacy_record_reading: pre-disclosure-shape
  legacy_record_default_meaning: forbidden
  new_write_may_omit_disclosure: false
  new_write_may_join_closed_set: false
  rewrite_of_existing_records: forbidden

# Selection-level context: what health contributed to the decision AS A WHOLE.
# `consulted` is the field that separates "health was never asked" from "health
# was asked and had nothing fresh to say", and those are opposite facts during
# an incident.
health_disclosure_fields:
  required:
    - consulted
    - adapter_outcome
    - effect
  conditionally_required:
    # Required whenever effect is `none` and any candidate's state is not
    # `healthy`. This is "health must never silently disappear" made structural
    # rather than asked for in prose.
    - warning
  optional:
    - evaluated_at

# Per-candidate result: what health said about THIS one.
candidate_health_fields:
  required:
    - instance_id
    - health_state
    - health_effect
  conditionally_required:
    - health_freshness
    - envelope_id
    - envelope_version
    - warning
    # Present only when the input was malformed, unreadable, unverifiable or
    # unavailable.
    - evidence_unusable_reason

health_disclosure_enums:
  consulted: [true, false]
  adapter_outcome:
    - answered
    - unreadable
    - unavailable
    - malformed
  effect:
    - removed-at-least-one
    - none
  health_effect:
    - removed
    - none
  health_state:
    # The seven health states, plus the one value that is not a health state at
    # all: no health runtime was asked.
    - not-consulted
    - unknown
    - unmonitored
    - insufficient-policy
    - healthy
    - degraded
    - unavailable
    - withheld

# Disclosure is DERIVED by the Fabric from an adapter answer. It is never
# supplied by a caller and never by a subject: a field a candidate could write
# about its own health would be a candidate writing its own eligibility.
health_disclosure_authored_by: fabric
health_disclosure_caller_supplied: forbidden

# Every considered candidate gets an entry, selected and excluded alike. A
# candidate already excluded for another reason carries the health state as
# observed with health_effect: none -- health is consulted after eligibility, so
# it changed nothing, and recording that keeps "health never disappears" true
# without implying health agreed.
candidate_health_covers: every-considered-candidate
# A refusal is still a decision health contributed to, so the selection-level
# block is required even when nothing was selected.
required_on_refusal: true

# The selection record describes a decision. It is not a transcript: prompts,
# payloads, and responses are never written here.
forbidden_fields:
  - prompt
  - prompt_content
  - request_payload
  - response_payload
  - response_content
  - trust_score
  - health_score
  - token
  - secret
  - credential
  - command
