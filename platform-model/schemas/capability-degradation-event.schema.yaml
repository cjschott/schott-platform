---
# Declarative schema for capability degradation events.
#
# A recorded transition between health states, not a status flag. It names the
# dimension that moved, the direction, the declared condition that was met, and
# the observations it was derived from.
#
# It describes observed history and never the future. A degradation event is
# not a warning that something will fail: the Occurrence and Experience layers
# already refuse to predict, and health refuses for the same reason. A platform
# that forecasts failure will eventually act on the forecast.
#
# Machine-generated, so identifiers are six digits.
#
# ARCHITECTURE ONLY. No runtime writes these records in this release.
#
# Governed by: docs/decisions/ADR-0013-capability-health-plane.md

api_version: schott-platform/v1
kind: Schema
schema_for: capability-degradation-event

provenance:
  class: declared
  source: docs/decisions/ADR-0013-capability-health-plane.md
  recorded_at: 2026-08-03
  last_reviewed: 2026-08-03

id_pattern: '^CHDEG-[0-9]{6}$'

mutability: immutable
update_methods: none
delete_methods: none
supersession: new-record-only
append_only_history: true

describes: observed-history-only

# Entry and exit conditions are declared separately on the envelope, and a
# transition requires the declared hysteresis to have been satisfied. A single
# threshold used for both directions is what produces flapping, and a flapping
# subject generates alert volume that trains an operator to ignore it.
hysteresis: declared-required

may_modify_trust_state: false
may_execute: false

required_fields:
  - event_id
  - subject_type
  - subject_id
  - from_state
  - to_state
  # Which dimension moved. A transition with no dimension cannot be
  # investigated.
  - dimension
  # The declared condition that was satisfied, quoted from the envelope, so the
  # event stays readable after the envelope is superseded.
  - entry_condition
  - observed_at
  - derived_from_observation_ids
  - provenance
  # THE HYSTERESIS PROOF. A transition that cannot show its hysteresis was
  # satisfied is not recordable, so every parameter has a matching OBSERVED
  # value beside it and an operator can recompute the verdict from this record
  # and the cited observations without access to the evaluator. These were
  # optional, which left an unprovable transition writable.
  - hysteresis
  - hysteresis_satisfied_over_seconds
  - hysteresis_first_observation_id
  - hysteresis_last_observation_id
  - hysteresis_sample_count
  - hysteresis_observed_max_gap_seconds

optional_fields:
  - exit_condition
  - envelope_id
  - notes

# ADR-0019. Structured, matching the envelope: the condition is quoted as the
# structured value so the event stays readable after the envelope is superseded.
condition_form: structured

# Two observations separated by a long gap do not establish continuous threshold
# violation, and a gap resets the interval regardless of why it exists. A
# monitoring outage therefore cannot manufacture a transition.
hysteresis_continuity: declared-required
unprovable_transition: refuse

# A transition cites observations and states; its subject must equal theirs.
# Identifier format is not sufficient -- a cross-subject citation is well-formed
# and false.
subject_binding: must-match-every-cited-record
identifier_format_sufficient: false
nonexistent_reference: refuse
cross_subject_citation: refuse

# A state with no predecessor is an initial state, not a transition, so no event
# is produced for a subject's first evaluation. Re-deriving the same state value
# also produces none: nothing transitioned.
first_evaluation_is_transition: false
unchanged_state_produces_event: false

# The name is historical, from the v0.9.6 reservation's `degradation-event`.
# This family records EVERY state transition, including recovery and including
# movement between non-findings -- a transition toward `healthy` is not a
# degradation and is recorded here regardless. Not renamed in this release: the
# identifier prefix, the ontology entry and the reserved name all depend on it.
records: all-health-state-transitions
name_is_historical: true

enums:
  subject_type:
    # A package is not a running thing and has no operational health.
    - capability-instance
    - capability-host
  from_state:
    - unknown
    - unmonitored
    - insufficient-policy
    - healthy
    - degraded
    - unavailable
    - withheld
  to_state:
    - unknown
    - unmonitored
    - insufficient-policy
    - healthy
    - degraded
    - unavailable
    - withheld

forbidden_fields:
  - predicted_failure
  - forecast
  - time_to_failure
  - probability
  - anomaly_score
  - health_score
  - trust_state
  - auto_drain
  - auto_quarantine
  - auto_reroute
  - auto_remediate
  - command
