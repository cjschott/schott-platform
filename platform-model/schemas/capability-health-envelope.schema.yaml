---
# Declarative schema for capability health envelopes.
#
# An envelope declares, per dimension, what acceptable looks like for one
# subject. Health is meaningless without it: "degraded" has to mean "outside
# something", and that something must be a limit a human wrote down.
#
# Thresholds are never learned. A threshold derived from a subject's own
# history is a threshold that subject chose, and "degraded" would then mean
# "unlike its own recent behaviour" -- a statement about change rather than
# about function. A subject that degrades slowly enough would teach the
# baseline that its new behaviour is normal.
#
# Human-declared, so identifiers are four digits.
#
# ARCHITECTURE ONLY. No runtime writes these records in this release.
#
# Governed by: docs/decisions/ADR-0013-capability-health-plane.md

api_version: schott-platform/v1
kind: Schema
schema_for: capability-health-envelope

provenance:
  class: declared
  source: docs/decisions/ADR-0013-capability-health-plane.md
  recorded_at: 2026-08-03
  last_reviewed: 2026-08-03

id_pattern: '^CHENV-[0-9]{4}$'

mutability: immutable
update_methods: none
delete_methods: none
supersession: new-record-only

authored_by: human
threshold_source: declared-only

# Experience may be cited as supporting evidence for a human's judgement about
# where a threshold belongs. It may never author or mutate the policy: a
# threshold the platform derived from a subject's own history is one that
# subject chose, and "degraded" would then mean "unlike its recent behaviour".
experience_may_reference: true
experience_may_author: false
experience_may_mutate: false
baseline_promotion: forbidden

# A threshold that widens because it keeps being exceeded measures nothing. The
# violations are the finding.
violation_widens_threshold: false

change_requires: immutable-approval

# The Null Policy Rule, applied per metric rather than per envelope. An
# envelope covering four dimensions and declaring three of them must not report
# the fourth as satisfied -- it must say it has no policy for it.
null_policy_scope: per-metric
absent_threshold_means: insufficient-policy
absent_threshold_never_means: healthy

# A later envelope never reaches back. One observation evaluated against two
# envelope versions may legitimately yield two different results, and both
# evaluations remain readable.
supersession_rewrites_prior_evaluations: false

# Mirrors the Null Policy Rule in the Confidence and Freshness Standard: the
# absence of a declared limit produces an explicit "not assessable", never a
# favourable default. A subject nobody has written an envelope for is not
# thereby working.
absent_envelope_means: unmonitored

# The Health Plane observes and never acts. Stated on every health schema so
# that no single record can be read as an exception.
may_modify_trust_state: false
may_execute: false

required_fields:
  - envelope_id
  # Supersession chains by version, so "which envelope was this evaluated
  # against" has an answer after the envelope has moved on.
  - envelope_version
  - subject_type
  - subject_id
  # Per-dimension limits. Each dimension declares its own entry and exit
  # conditions and its own freshness policy.
  - dimensions
  # How the declared limits combine into one state, declared rather than left
  # to an implementation to choose.
  - evaluation
  - provenance

optional_fields:
  - description
  - review_due_at
  - supersedes
  - superseded_by
  - notes

enums:
  subject_type:
    # A package is not a running thing. Operational health is a property of the
    # instances that run it, so a package is not a subject here -- the same
    # reasoning that reconciled `endpoint-health` away. Package integrity is the
    # Integrity plane's concern.
    - capability-instance
    - capability-host
  evaluation:
    # Any dimension outside its limit degrades the subject. The conservative
    # default, and the only one defined in this release.
    - worst-dimension-wins

# Every dimension entry declares all of these. Entry and exit are separate
# because a single threshold used for both is what produces flapping.
dimension_fields:
  required:
    - dimension
    - unit
    - entry_condition
    - exit_condition
    # Required, not optional: a subject that crosses a boundary once has not
    # degraded.
    - hysteresis
    # Null is permitted and produces freshness: unknown, per the Null Policy
    # Rule. It must never be defaulted to a number.
    - freshness_policy_seconds
    # How the dimension's observations combine before comparison. Declared, not
    # inferred from the dimension.
    - aggregation

# ADR-0019. Conditions are STRUCTURED, not expression strings: there is no
# parser, because the smallest thing that satisfies "same inputs, same state,
# every time" is a form that cannot be mis-parsed. An expression string is
# refused.
condition_form: structured
condition_expression_strings: forbidden

condition_fields:
  required:
    - operator
    - value

# Closed, five. No ne, no ranges, no boolean combinators, no negation: a
# dimension needing two bounds declares two dimensions, or uses the asymmetry
# between entry and exit, which is what that asymmetry is for.
condition_operators:
  - gt
  - ge
  - lt
  - le
  - eq

# A decimal string compared as an exact decimal, never a binary float. A
# threshold that compares differently on two hosts is not deterministic.
condition_value_representation: decimal-string

# Closed, two. No percentile in v1: it is not expressible against an
# observation model whose record is one measurement at one moment, "p95" is not
# one definition, and hysteresis already provides the flap protection a
# percentile was reaching for.
aggregations:
  - instant
  - windowed_count
percentile_aggregation: forbidden

# Reuses the convention capability-route already declares for its overlap
# window rather than inventing a second one.
window_boundaries: start-inclusive-end-exclusive

# Required on windowed_count. One sample in an empty window is not a verdict.
windowed_count_fields:
  required:
    - kind
    - window_seconds
    - min_samples

# Exactly one unit per dimension. The envelope's unit must EQUAL the
# observation's; a mismatch is refused, never converted. Implicit conversion is
# how 2000ms and 2s become a silent disagreement.
unit_mismatch: refuse
unit_conversion: forbidden
dimension_units:
  availability: boolean
  heartbeat-freshness: seconds
  transport-health: boolean
  latency: milliseconds
  queue-depth: items
  success-count: count
  failure-count: count
  cpu-utilization: percent
  memory-utilization: percent
  gpu-utilization: percent
  vram-utilization: percent
  storage-pressure: percent
  collector-freshness: seconds

# ADR-0019. One kind in v1. `occurrences` is expressible in the CONDITION
# through windowed_count, so supporting it here would mean two proof shapes on
# the transition record and a discriminator, for a distinction already covered.
hysteresis_kinds:
  - duration

# All four required. A defaulted continuity parameter is an unanswered
# configuration question rendered as a confident assessment -- the same mistake
# the Null Policy Rule exists to prevent -- so an envelope omitting either
# continuity member is refused.
hysteresis_fields:
  required:
    - kind
    - seconds
    - max_gap_seconds
    - min_samples

# Two observations separated by a long gap do not establish continuous
# threshold violation. A gap resets the interval REGARDLESS of why it exists,
# which is collection_failure_implies_subject_failure enforced arithmetically:
# a monitoring outage produces a gap in usable observations, the gap breaks
# continuity, and a monitoring failure therefore cannot manufacture a
# transition.
hysteresis_continuity:
  usable_observation: collected-with-value-within-freshness-policy
  violation_required: every-usable-observation-in-interval
  minimum_coverage: min_samples
  maximum_gap: max_gap_seconds
  gap_applies_to_interval_boundaries: true
  reset_on_non_violating_usable_observation: true
  reset_on_gap_exceeding_maximum: true
  gap_cause_affects_reset: false

forbidden_fields:
  - learned_threshold
  - auto_threshold
  - baseline_threshold
  - derived_threshold
  - anomaly_model
  - anomaly_score
  - forecast
  - predicted_limit
  - health_score
  - trust_state
  - command
