---
# Declarative schema for capability health envelopes.
#
# An envelope declares, per dimension, what acceptable looks like for one
# subject. Health is meaningless without it: "degraded" has to mean "outside
# something", and that something must be a limit a human wrote down.
#
# Thresholds are never learned. A threshold derived from a subject's own
# history is a threshold that subject chose, and "degraded" would then mean
# "unlike its own recent behaviour" -- a statement about change rather than
# about function. A subject that degrades slowly enough would teach the
# baseline that its new behaviour is normal.
#
# Human-declared, so identifiers are four digits.
#
# ARCHITECTURE ONLY. No runtime writes these records in this release.
#
# Governed by: docs/decisions/ADR-0013-capability-health-plane.md

api_version: schott-platform/v1
kind: Schema
schema_for: capability-health-envelope

provenance:
  class: declared
  source: docs/decisions/ADR-0013-capability-health-plane.md
  recorded_at: 2026-08-03
  last_reviewed: 2026-08-03

id_pattern: '^CHENV-[0-9]{4}$'

mutability: immutable
update_methods: none
delete_methods: none
supersession: new-record-only

authored_by: human
threshold_source: declared-only

# Mirrors the Null Policy Rule in the Confidence and Freshness Standard: the
# absence of a declared limit produces an explicit "not assessable", never a
# favourable default. A subject nobody has written an envelope for is not
# thereby working.
absent_envelope_means: unmonitored

# The Health Plane observes and never acts. Stated on every health schema so
# that no single record can be read as an exception.
may_modify_trust_state: false
may_execute: false

required_fields:
  - envelope_id
  - subject_type
  - subject_id
  # Per-dimension limits. Each dimension declares its own entry and exit
  # conditions and its own freshness policy.
  - dimensions
  # How the declared limits combine into one state, declared rather than left
  # to an implementation to choose.
  - evaluation
  - provenance

optional_fields:
  - description
  - review_due_at
  - supersedes
  - superseded_by
  - notes

enums:
  subject_type:
    - capability-instance
    - capability-host
    - capability-package
  evaluation:
    # Any dimension outside its limit degrades the subject. The conservative
    # default, and the only one defined in this release.
    - worst-dimension-wins

# Every dimension entry declares all of these. Entry and exit are separate
# because a single threshold used for both is what produces flapping.
dimension_fields:
  required:
    - dimension
    - unit
    - entry_condition
    - exit_condition
    # Required, not optional: a subject that crosses a boundary once has not
    # degraded.
    - hysteresis
    # Null is permitted and produces freshness: unknown, per the Null Policy
    # Rule. It must never be defaulted to a number.
    - freshness_policy_seconds

forbidden_fields:
  - learned_threshold
  - auto_threshold
  - baseline_threshold
  - derived_threshold
  - anomaly_model
  - anomaly_score
  - forecast
  - predicted_limit
  - health_score
  - trust_state
  - command
