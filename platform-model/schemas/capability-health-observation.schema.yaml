---
# Declarative schema for capability health observations.
#
# One measurement, of one dimension, of one subject, at one moment, from one
# named source. It is evidence and it carries no verdict: no state, no
# conclusion, no score. An observation that concluded would be a measurement
# that had already decided.
#
# The most important field here is collection_status. A collector that cannot
# reach a host records that it failed; it concludes nothing about the host. A
# monitor that read its own outage as the subject being broken would
# manufacture findings out of its own failures, and would do so most
# enthusiastically during a network incident -- when its findings are least
# reliable and most likely to be acted on.
#
# Machine-generated, so identifiers are six digits.
#
# ARCHITECTURE ONLY. No runtime writes these records in this release.
#
# Governed by: docs/decisions/ADR-0013-capability-health-plane.md

api_version: schott-platform/v1
kind: Schema
schema_for: capability-health-observation

provenance:
  class: declared
  source: docs/decisions/ADR-0013-capability-health-plane.md
  recorded_at: 2026-08-03
  last_reviewed: 2026-08-03

id_pattern: '^CHOBS-[0-9]{6}$'

mutability: immutable
update_methods: none
delete_methods: none
supersession: new-record-only
append_only_history: true

record_class: evidence

# The rule the collector standard establishes one layer down, restated because
# this is the layer most tempted to break it.
collection_failure_implies_subject_failure: false

may_modify_trust_state: false
may_execute: false

required_fields:
  - observation_id
  - subject_type
  - subject_id
  - dimension
  # Null when collection_status is not "collected". A failed collection has no
  # measurement, and recording a zero would be inventing one.
  - measured_value
  - unit
  - observed_at
  # A GOVERNED identity from the platform's existing closed collector registry,
  # not a self-chosen string. A free-text source is not an identity: it cannot
  # be weighed against a contradicting one, and it lets a forged observation
  # name any origin it likes. These are the two fields the released
  # `observation` schema already requires, reused rather than reinvented.
  - collector_id
  - source_fingerprint
  - collection_status
  - provenance

optional_fields:
  - collection_error
  - freshness
  - sample_window_seconds
  - notes

# An unregistered collector_id is refused. The registry is the existing closed
# one, so no parallel identity system is introduced.
collector_identity: closed-registry
free_text_source: forbidden

# Two or more FRESH observations of the same dimension for the same subject,
# from different collector_ids, disagreeing about the declared condition,
# produce `unknown` for that dimension with every contradicting observation
# cited and review_required: true.
#
# Newest-wins was rejected because it lets a compromised collector win by
# writing last, which is the cheapest attack available. Trusted-source
# precedence was rejected because it would make Health read trust standing as
# an input to a health verdict. Uncertainty must become NEITHER a positive
# claim NOR positive evidence for removal.
contradicting_sources: unknown-with-all-cited
contradiction_requires_review: true

# ADR-0013. Only a failure attributed to the capability instance may contribute
# to failure-count. A governed `refused` is the platform working correctly; an
# adapter or serialisation failure is Kyri's; a timeout or an interruption is
# ambiguous and is not attributed. Counting any of them would let the platform's
# own faults read as the subject's.
failure_count_counts: subject-attributable-only
platform_side_failures_count: never
ambiguous_failures_count: never

enums:
  subject_type:
    # A package is not a running thing and has no operational health. Package
    # integrity and verification evidence belong to the Integrity plane; this
    # is the same reasoning that reconciled `endpoint-health` away rather than
    # shipping a schema whose subject does not exist.
    - capability-instance
    - capability-host
  collection_status:
    - collected
    - failed
    - unavailable
  dimension:
    # Availability and liveness
    - availability
    - heartbeat-freshness
    - transport-health
    # Performance
    - latency
    - queue-depth
    - success-count
    - failure-count
    # Resource pressure
    - cpu-utilization
    - memory-utilization
    - gpu-utilization
    - vram-utilization
    - storage-pressure
    # The observability layer observing itself. A stale collector is a fact
    # about the collector, not about the subject.
    - collector-freshness
  # Reused from the Confidence and Freshness Standard rather than redefined.
  # A null policy produces unknown, never a default maximum age.
  freshness:
    - current
    - aging
    - stale
    - unknown

# Which subjects each dimension may describe. Declared here rather than left to
# a collector's judgement: an `availability` observation about a package is a
# claim about something that does not run.
dimension_subjects:
  availability: [capability-instance, capability-host]
  heartbeat-freshness: [capability-instance, capability-host]
  transport-health: [capability-instance, capability-host]
  latency: [capability-instance, capability-host]
  queue-depth: [capability-instance, capability-host]
  success-count: [capability-instance, capability-host]
  failure-count: [capability-instance, capability-host]
  cpu-utilization: [capability-instance, capability-host]
  memory-utilization: [capability-instance, capability-host]
  gpu-utilization: [capability-instance, capability-host]
  vram-utilization: [capability-instance, capability-host]
  storage-pressure: [capability-instance, capability-host]
  # A fact about the collector rather than about the subject, so it is valid
  # wherever an observation is.
  collector-freshness: [capability-instance, capability-host]

# An observation measures. It never concludes, predicts, or scores, and it
# never carries the standing of the thing it measured.
forbidden_fields:
  - source
  - health_state
  - verdict
  - conclusion
  - assessment
  - trust_state
  - eligibility
  - predicted_value
  - forecast
  - anomaly_score
  - health_score
  - recommendation
  - command
  - argv
