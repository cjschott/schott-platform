---
# Declarative schema for capability hosts.
#
# A capability host is a machine offering execution capacity, and it is the
# trust subject in the `fabric-node` domain ADR-0011 reserved. The record says
# what the machine IS and what it may ever see. It never says what it is
# allowed to run: that is a property of the instance, because it depends on the
# package as much as on the machine.
#
# No host, GPU, or vendor is named in this schema. The workstation, the
# reference host, the virtualisation host, and any future cloud node are all
# records with different attribute values.
#
# Human-declared, so identifiers are four digits.
#
# ARCHITECTURE ONLY. No runtime writes these records in this release.
#
# Governed by: docs/decisions/ADR-0012-distributed-capability-fabric.md

api_version: schott-platform/v1
kind: Schema
schema_for: capability-host

provenance:
  class: declared
  source: docs/decisions/ADR-0012-distributed-capability-fabric.md
  recorded_at: 2026-08-03
  last_reviewed: 2026-08-03

id_pattern: '^CHOST-[0-9]{4}$'

mutability: immutable
update_methods: none
delete_methods: none
supersession: new-record-only

trust_domain: fabric-node

# Being reachable is not a qualification. A machine that answers on the network
# has demonstrated that it is on the network, and nothing else.
reachability_implies_trust: false
reachability_implies_admission: false

required_fields:
  - capability_host_id
  # Declared by an operator and verified out of band. A hostname is a label,
  # not an identity: renaming a machine changes nothing, reinstalling it makes
  # a new subject requiring a new decision.
  - node_identity_reference
  - fabric_node_trust_record_id
  # Verified, not advertised. The advertised profile lives on the
  # advertisement, where it is visibly a claim.
  - verified_resource_profile
  - location_class
  # The one workload data classification this machine may handle. Compared by
  # exact membership, never by rank: no accepted source declares an ordering of
  # classifications, so "ceiling" was withdrawn as a name that implied one.
  - data_classification
  # Declared by an operator: in service, or deliberately withheld. This is how
  # a node is removed from service on purpose rather than by failing.
  - availability_intent
  # Which governed evidence supports the verified profile above. Required,
  # because `verified_resource_profile` is: a host that claims a verified
  # profile without identifying what verified it is making the claim §6.2
  # rejects, and admission has always refused one. It was listed optional here
  # while being mandatory in practice, which is a disagreement between layers
  # rather than a case anybody could be in.
  #
  # WHAT IT REFERENCES IS NOT YET GOVERNED. No namespace, referent, or
  # resolution rule is declared for it anywhere, so it is required to be
  # PRESENT and is not yet required to RESOLVE. Ruling that is open work; until
  # it closes, admission checks presence only and says so.
  - verification_reference
  - provenance

optional_fields:
  - name
  - description
  - supersedes
  - superseded_by
  - notes

# The controlled vocabulary for heterogeneous hardware. Expressed in terms no
# vendor owns, so a new accelerator generation is a value, not a schema change.
#
# CLOSED. A dimension outside this vocabulary is refused wherever a resource
# mapping is recorded — on a host profile, a package or contract requirement,
# and an advertised claim. An unrecognised dimension is not a narrower claim;
# it is a claim nobody validated, and under containment it would silently
# satisfy nothing and constrain nothing.
#
# Each entry declares how it is COMPARED, because "requirement" means two
# different things here. A `capacity` is a quantity and is satisfied when what
# is available is at least what was required. A `token` is an identity from a
# closed set and is satisfied only by the same token. Comparing a capacity for
# equality — which the runtime did until this was made explicit — refuses every
# machine larger than the one asked for.
resource_profile_vocabulary:
  accelerator_class:
    description: The kind of acceleration available, if any.
    comparison: exact-token-equality
    values:
      - none
      - integrated-gpu
      - discrete-gpu
      - dedicated-accelerator
      - remote-service
  accelerator_memory_mb:
    description: Usable accelerator memory in mebibytes.
    type: integer
    value_domain: positive-integer
    comparison: available-at-least-required
  accelerator_compute_capability:
    description: >-
      Opaque vendor capability string. Compared only by declared match rules,
      never ordered numerically: ordering vendor strings works until the
      generation where it does not.
    type: string
    # The one declared match rule is equality. Stated rather than left implicit:
    # this previously said "declared match rules only" and declared none, which
    # reads as a promise that some other rule exists somewhere.
    comparison: exact-token-equality
  host_memory_mb:
    description: Usable system memory in mebibytes.
    type: integer
    value_domain: positive-integer
    comparison: available-at-least-required
  host_cpu_cores:
    description: Usable CPU cores.
    type: integer
    value_domain: positive-integer
    comparison: available-at-least-required
  architecture:
    description: >-
      Instruction set architecture of the HOST. Independent of any container
      image's architecture: an OCI image reporting `amd64` describes the image,
      not this machine, and the two are never compared directly.
    type: string
    comparison: exact-token-equality
    # Governed tokens, not producer spellings. `uname -m` reports `x86_64` and
    # `dpkg --print-architecture` reports `amd64` for this same ISA, so no
    # producer's spelling can be the governed value without picking a vendor.
    # Raw observations are normalised once, where an operator constructs
    # verified evidence, and the raw values are retained there as evidence.
    # Extended only by a reviewed decision, never by observing a new machine.
    values:
      - x86-64

enums:
  location_class:
    - on-premises
    - operator-controlled-remote
    - third-party-hosted
  availability_intent:
    - in-service
    - draining
    - withheld
  # The workload data sensitivity axis. Must match capability-route.schema.yaml
  # exactly. It is a DIFFERENT axis from the storage recoverability labels
  # (authoritative, reconstructable, mixed) that share the key name elsewhere in
  # the model, and the two are never compared. Adding a value is a reviewed
  # decision, never an inference from a new host or service.
  data_classification:
    - internal

# A machine is superseded, never edited. Nothing points forward, so the current
# declaration is the one no other record supersedes; a chain that forks or
# loops is reported and never repaired.
# Which identity a host declares itself under, when this platform model already
# describes the machine.
#
# `node_identity_reference` is opaque by design and this schema constrains no
# form for it: a fabric may admit machines the model does not describe, and an
# identity supplied by reference is the point. What had no rule was the case
# where the model DOES describe the machine. A host standing for `HOST-0001`
# could be declared under any string at all, so nothing downstream could tell
# that a piece of evidence, a trust record and a host record were about one
# machine — and the three planes name their subjects in three namespaces that
# would never meet by accident.
#
# The rule is identity equality, not a hostname mapping. `schai` is a label;
# `HOST-0001` is the identity. Nothing is inferred from a hostname, an
# endpoint, or a resemblance between strings, which is the same discipline
# ADR-0012 already applies to `local_node_identity`.
#
# ON REINSTALLATION, stated because this narrows a property the note above
# claims. A hostname survives a reinstall and so does an entity identifier, so
# neither makes a reinstalled machine a new subject on its own. What does is a
# model decision: identifiers are unique and immutable and are never reused
# after retirement, so a machine rebuilt as a genuinely new subject is a
# retired entity and a new one, and it therefore carries a new node identity
# and starts a new supersession chain. A rebuild that the model still regards
# as the same entity supersedes instead. The judgement moves to the plane that
# owns entity lifecycle rather than being implied by the identity's shape.
#
# NOT MECHANICALLY ENFORCED HERE, and deliberately. Checking that an identifier
# names a real entity means reading the platform model, and Fabric admission
# opens no file — a property worth more than an early check. The equality below
# is what makes it verifiable: an Evidence resolver comparing `EVID.target`
# with `node_identity_reference` proves both sides name one entity without
# admission having to resolve either.
platform_model_node_identity:
  applies_to: capability-host-representing-a-platform-model-host
  identity: platform-model-host-entity-id
  comparison: exact-equality
  inference_from_hostname: not-permitted
  identifier_prefix: HOST
  identifier_authority: docs/standards/platform-ontology-standard.md
  # The same identifier, read by three planes that each name subjects their own
  # way. Fixing the equalities here is what lets a later resolver check them.
  equal_to:
    evidence_target: EVID.target
    trust_subject: trust-record.subject_identifier
    selection_context: local_node_identity

supersession_chain_identity: node_identity_reference
supersession_head_resolution: unique-unsuperseded-record-in-chain
supersession_forked: refuse
supersession_cyclic: refuse

# What makes one declaration authoritatively different from another. A
# successor differing only in provenance, notes, evidence, name, description,
# or its allocated identity declares nothing new and is refused.
authoritative_fields:
  - fabric_node_trust_record_id
  - verified_resource_profile
  - verification_reference
  - location_class
  - data_classification
  - availability_intent

# Availability moves away from service by decision; it returns only through a
# declaration refresh, which is evaluated against then-current trust. A
# transition to the intent already declared writes nothing.
availability_transitions:
  - {from: in-service, to: draining,   operation: withdraw-subject, trust_queries: 0}
  - {from: in-service, to: withheld,   operation: withdraw-subject, trust_queries: 0}
  - {from: draining,   to: withheld,   operation: withdraw-subject, trust_queries: 0}
  - {from: draining,   to: in-service, operation: refresh-subject,  trust_queries: 1}
  - {from: withheld,   to: in-service, operation: refresh-subject,  trust_queries: 1}
  - {from: withheld,   to: draining,   operation: refresh-subject,  trust_queries: 1}
no_op_transition: refuse
refresh_without_authoritative_change: refuse

# An advertisement is a claim published by a subject as it is now, so it must
# cite the current declaration. An instance cites the declaration that was
# current when it was admitted, and that stays readable for ever.
advertisement_must_cite: current-head
instance_cites: declaration-current-at-admission

# A host describes itself. It never establishes its own standing, and it holds
# no credential material: the record proves a machine was verified, it is not a
# way to authenticate as one.
forbidden_fields:
  - auto_register
  - auto_enroll
  - auto_admit
  - self_admit
  - trust_on_first_use
  - trust_state
  - trust_score
  - scope_grant
  - route_id
  - peer_hosts
  - cluster_members
  - private_key
  - private_key_content
  - password
  - passphrase
  - token
  - secret
  - credential
  - command
