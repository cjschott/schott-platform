---
# Declarative schema for capability health states.
#
# The derived current standing of one subject: a deterministic function of the
# observations cited on it and the envelope it was evaluated against. Same
# inputs, same state, every time. It records the observation identifiers it was
# derived from, so any assessment can be re-checked against the evidence that
# produced it.
#
# The eligibility fields below are the load-bearing part. Health may subtract
# from what trust already allowed, and only on evidence. It may never add,
# never reorder, and `unknown` does neither -- if unknown removed candidates, a
# monitoring outage would empty every route and become a platform outage; if
# unknown counted as healthy, not reporting would be the cheapest way to look
# good.
#
# Machine-generated, so identifiers are six digits.
#
# ARCHITECTURE ONLY. No runtime writes these records in this release.
#
# Governed by: docs/decisions/ADR-0013-capability-health-plane.md

api_version: schott-platform/v1
kind: Schema
schema_for: capability-health-state

provenance:
  class: declared
  source: docs/decisions/ADR-0013-capability-health-plane.md
  recorded_at: 2026-08-03
  last_reviewed: 2026-08-03

id_pattern: '^CHSTATE-[0-9]{6}$'

mutability: immutable
update_methods: none
delete_methods: none
supersession: new-record-only
append_only_history: true

# Absence of an assessment is unknown, and unknown is never healthy.
default_state: unknown
evaluation: deterministic

may_modify_trust_state: false
may_execute: false

# Health narrows; it never widens. The Fabric grants eligibility from trust,
# and health may take a candidate out of consideration on positive evidence.
may_remove_from_eligibility: true
may_add_to_eligibility: false
may_reorder_candidates: false
unknown_effect_on_eligibility: inert

# Only a fresh, positive observation of an ineligible condition subtracts. An
# absence of evidence never removes a candidate, and never clears a finding
# either -- silence is not recovery.
removal_requires: fresh-positive-evidence
unknown_may_clear_prior_finding: false
stale_may_support_healthy: false

# Exactly one state supports a positive claim. Everything else is an absence of
# one, and an absence must never be rendered as reassurance.
states_supporting_positive_claim:
  - healthy
inert_states:
  - unknown
  - unmonitored
  - insufficient-policy
  - withheld

# The renderings that convert an absence of evidence into a positive claim.
# Declared as forbidden on the record rather than discouraged in prose, because
# this is exactly the wording a dashboard reaches for when a tile is empty.
forbidden_renderings:
  - assumed-healthy
  - probably-available
  - no-known-issues
  - healthy-by-default

# Required on every state, including unknown. A state with neither cannot be
# argued with, and an unknown that carries no reason is indistinguishable from
# one nobody looked at.
freshness_required_for_all_states: true
reason_required_for_all_states: true

# TWO DIFFERENT FRESHNESSES EXIST AND MUST NOT BE CONFUSED.
#
# What is STORED here is freshness as it stood at `evaluated_at` -- a historical
# fact about what the evidence looked like when the assessment was made, which
# is what an incident review needs.
#
# What a consumer USES is recomputed at the moment of use, from each cited
# observation's observed_at against that dimension's declared policy and the
# caller's evaluation instant. Nothing may read the stored label to decide a
# subtraction: a stored `current` would otherwise remain operationally current
# forever, and a dead collector would freeze a favourable assessment.
stored_freshness: freshness-at-evaluated-at
stored_freshness_authoritative_for_eligibility: false
freshness_recomputed_at_use: true

# Explicitly invoked and append-only. Every evaluation writes a new record
# carrying its own evaluated_at; there is no background daemon and no scheduler.
evaluation_trigger: explicitly-invoked
background_writer: none

# A state with no predecessor for its subject is an INITIAL state and produces
# no transition record: `unknown` is the default, not a state the subject was
# previously in, so there is nothing to transition from -- and a declared
# hysteresis could not be satisfied over a span that does not exist.
first_evaluation_is_transition: false

# ADR-0013. `healthy` requires at least one satisfied dimension established by
# an observation whose collector_id is NOT the subject itself. A heartbeat is a
# claim: it may support bounded liveness and can never, alone, support a
# `healthy` conclusion. An envelope declaring only subject-derived dimensions
# yields `insufficient-policy` -- it has not declared enough to assert health.
healthy_requires_independent_evidence: true
subject_reported_dimensions_alone_support_healthy: false
envelope_of_only_subject_reported_dimensions: insufficient-policy

# A citation is not validated by identifier format. A state citing another
# subject's observations is well-formed, correctly typed, and false -- and it is
# the cheapest route to a forged positive claim, because every individual record
# passes inspection while the relationship between them lies. Enforced at write
# time, because that is the only point a false citation can be stopped before it
# becomes evidence.
subject_binding: must-match-every-cited-record
identifier_format_sufficient: false
nonexistent_reference: refuse
cross_subject_citation: refuse

# A later envelope never reaches back. Re-evaluating one observation against a
# newer envelope produces a new record; the old one stands as what was believed
# at the time, which is the only thing that makes an incident review possible.
supersession_rewrites_prior_evaluations: false

# Health subtracts from what other layers allowed. It never overrides any of
# these, however good the reading is.
cannot_override:
  - manual-drain
  - restricted-scope
  - quarantine
  - revocation
  - availability-intent

# withheld, corrected. It previously restated the Fabric's availability intent,
# which left the health layer with no way to say "we are deliberately not
# asserting a conclusion" -- and made a health state into a selection control.
withheld_semantics:
  means: health-conclusion-not-asserted-or-published
  implies_healthy: false
  implies_degraded: false
  implies_unavailable: false
  # The correction. A health state describes what health knows, and never
  # decides whether a capability is offered.
  removes_eligibility: false
  equivalent_to_do_not_select: false
  may_set_availability_intent: false
  # The influence runs one way: an operator withdrawing a node is a reason to
  # stop publishing conclusions about it, not the other way round.
  availability_intent_may_influence_publication: true
  # ADR-0013, ENG-0006-C. The state and its meaning are settled; who may cause
  # it to be published is NOT, and is deliberately unresolved in this release.
  # Deterministic derivation never emits it: it is the one state that is not a
  # finding about a subject, so observations and an envelope cannot produce it.
  # No publication-control block was added to the envelope to avoid defining an
  # authority -- an envelope declares limits, and mixing a publication decision
  # into it would put two concerns on one record.
  v1_producer: none
  derivable_from_observations: false
  publication_authority: deferred-architecture

required_fields:
  - state_id
  - subject_type
  - subject_id
  - state
  # Null only when state is `unmonitored`, which is precisely the case of
  # having no envelope to evaluate against.
  - envelope_id
  # The version evaluated against, recorded so a later supersession cannot
  # change what a past assessment meant.
  - envelope_version
  # The evidence. A state that cited nothing could not be re-checked, which
  # would make it an opinion.
  - derived_from_observation_ids
  - freshness
  # Written, not a code. "Which dimension, against which declared limit" is
  # what an operator needs at the moment they read this.
  - reason
  - evaluated_at
  - provenance

# The Null Policy Rule, inherited EXACTLY from the Confidence and Freshness
# Standard -- which requires `freshness: unknown` to arrive WITH
# review_required: true, never a default maximum age. Conditionally required:
# present and true when the state arises from a null freshness policy, from
# insufficient-policy, or from contradicting sources; present and false
# otherwise. Stored rather than derived at read time, because an envelope is
# superseded rather than edited and a later version declaring the missing policy
# must not retroactively clear the flag on a past assessment.
conditionally_required_fields:
  - review_required

optional_fields:
  - dimension_results
  - supersedes
  - superseded_by
  - notes

enums:
  subject_type:
    # A package is not a running thing and has no operational health. Package
    # integrity belongs to the Integrity plane.
    - capability-instance
    - capability-host
  state:
    # No fresh observation exists. The default, and inert for eligibility.
    - unknown
    # No envelope declared at all, so health is not assessable. Distinct from
    # unknown: one means "we have not looked", the other "there is nothing to
    # look against".
    - unmonitored
    # An envelope exists but a metric it should govern has no declared
    # threshold. The Null Policy Rule applied per metric: an envelope covering
    # four dimensions and declaring three must not report the fourth as
    # satisfied.
    - insufficient-policy
    - healthy
    # Outside the envelope on at least one dimension, still responding.
    - degraded
    # Not responding, or heartbeat stale beyond its declared threshold.
    - unavailable
    # Health conclusions are intentionally not asserted or published for this
    # subject. Not a statement that it is healthy, degraded, or unavailable,
    # and not a selection control -- see withheld_semantics below.
    - withheld
  # Reused from the Confidence and Freshness Standard rather than redefined.
  freshness:
    - current
    - aging
    - stale
    - unknown

forbidden_fields:
  - health_score
  - trust_state
  - trust_score
  - predicted_state
  - forecast
  - anomaly_score
  - auto_drain
  - auto_quarantine
  - auto_reroute
  - auto_remediate
  - command
