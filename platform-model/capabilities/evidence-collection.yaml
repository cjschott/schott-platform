---
# Evidence Collection capability.
#
# Maturity is a claim about implementation, not intent. See the rationale
# below for why this value was chosen.
#
# Governed by: docs/standards/capability-model-standard.md

api_version: schott-platform/v1
kind: Capability

id: CAP-0002
type: capability
name: Evidence Collection
slug: evidence-collection
lifecycle: active
owner: platform-engineering
maturity: partial
risk: high
approval_required: false
review_required: true

provenance:
  class: declared
  source: docs/standards/capability-model-standard.md
  recorded_at: 2026-08-01
  last_reviewed: 2026-08-01

description: >-
  Collect immutable, timestamped observations from platform sources and return them as normalized data.

maturity_rationale: >-
  Partial, not operational: three real collectors now observe live local
  sources — git repository state, rendered Compose configuration, and human
  attestation — so real input flows through the framework for the first time.
  It remains partial because collection is local only, nothing observes a
  remote host, and no evidence record is persisted: collectors return
  CollectorResult objects and the orchestrator that would turn them into
  evidence does not exist yet.

review_note: >-
  Advanced from foundation to partial in v0.6.0. Confirm the maturity claim
  once an orchestrator persists evidence records; until then no EVID record
  exists despite real collection occurring.

inputs:
  - Collection context
  - Source material

outputs:
  - Normalized observations
  - Collector results

dependencies:
  - CAP-0001

implemented_by:
  - tools/collectors/
  - tools/collectors/plugins/git_repository/
  - tools/collectors/plugins/configuration_render/
  - tools/collectors/plugins/manual_attestation/
  - platform-model/schemas/evidence.schema.yaml

validated_by:
  - tests/test-collector-framework.sh
  - tests/test-initial-collectors.sh
  - tests/test-evidence-validator.sh

documented_by:
  - docs/standards/evidence-standard.md
  - docs/standards/collector-plugin-standard.md
  - docs/decisions/ADR-0002-evidence-first-architecture.md

relationships:
  canonical_source: platform-model/relationships/platform-capabilities.yaml
