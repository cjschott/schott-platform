---
# Validation rules for the Schott Platform knowledge model.
#
# Severity meanings:
#   error       - the model is invalid; CI must fail.
#   warning     - the model is usable but incomplete; review required.
#   information - advisory signal for future work; does not block.
#
# Rule identifiers are stable. Retiring a rule must not reuse its identifier.
#
# Governed by:
#   docs/standards/platform-ontology-standard.md
#   docs/standards/operational-metadata-standard.md

api_version: schott-platform/v1
kind: ValidationRuleSet

provenance:
  class: declared
  source: docs/standards/platform-ontology-standard.md
  recorded_at: 2026-08-01
  last_reviewed: 2026-08-01

validation_rules:
  - id: VAL-001
    name: Unique entity identifiers
    description: Every entity id must be unique across the entire model.
    severity: error
    applies_to: [roles, hosts, services]
    remediation: Assign a new unstated identifier; never reuse a retired one.

  - id: VAL-002
    name: Filename matches content id
    description: An entity filename must begin with the entity id it contains.
    severity: error
    applies_to: [roles, hosts, services]
    remediation: Rename the file to "<ID>-<slug>.yaml" or correct the id field.

  - id: VAL-003
    name: References resolve
    description: Every relationship source and target must reference an existing entity.
    severity: error
    applies_to: [relationships]
    remediation: Create the missing entity or remove the dangling relationship.

  - id: VAL-004
    name: Approved entity types
    description: Every entity type must be defined in entity-types.yaml.
    severity: error
    applies_to: [roles, hosts, services]
    remediation: Use an approved type or propose an ontology change.

  - id: VAL-005
    name: Approved relationship types
    description: Every relationship must use a type defined in relationship-types.yaml.
    severity: error
    applies_to: [relationships]
    remediation: Use an approved relationship or propose an ontology change.

  - id: VAL-006
    name: Service belongs to one platform role
    description: Every service must declare exactly one primary platform role.
    severity: error
    applies_to: [services]
    remediation: Set platform_role to a single existing role id.

  - id: VAL-007
    name: Deployed service runs on a deployment target
    description: Every deployed service must declare a host, virtual machine, or container target.
    severity: error
    applies_to: [services]
    remediation: Set deployment.host to an existing deployment target.

  - id: VAL-008
    name: Critical services declare an owner and recovery reference
    description: Tier 0 and Tier 1 services must name an owner and an approved recovery procedure.
    severity: error
    applies_to: [services, hosts]
    remediation: Set owner and operations.recovery_reference.

  - id: VAL-009
    name: Remotely exposed services carry a security classification
    description: Any service reachable beyond its host must declare exposure, authentication, and approved source scope.
    severity: error
    applies_to: [services]
    remediation: Complete the security and network blocks per the Service Exposure Standard.

  - id: VAL-010
    name: Private services must not publish wildcard host ports
    description: A service classified private must not declare a host-published port or a wildcard bind address.
    severity: error
    applies_to: [services]
    remediation: Remove the published port or reclassify the exposure with approval.

  - id: VAL-011
    name: Observed facts carry observed_at
    description: Any fact with provenance class observed must include an observed_at timestamp.
    severity: error
    applies_to: [roles, hosts, services, relationships]
    remediation: Add an RFC 3339 observed_at value or reclassify the fact as declared.

  - id: VAL-012
    name: Inferred facts are not represented as observed
    description: A fact derived by inference must be labeled inferred and carry derived_from.
    severity: error
    applies_to: [roles, hosts, services, relationships]
    remediation: Set provenance.class to inferred and record the source rule and inputs.

  - id: VAL-013
    name: No secret values
    description: The model must never contain passwords, keys, tokens, or real environment values.
    severity: error
    applies_to: [roles, hosts, services, relationships, ontology]
    remediation: Replace the value with a secret_source reference.

  - id: VAL-014
    name: No volatile runtime values as declared facts
    description: Kernel versions, container ids, image digests, uptime, disk usage, and lease state must not be declared.
    severity: error
    applies_to: [hosts, services]
    remediation: Record a retrieval command, or store the value as an observed fact.

  - id: VAL-015
    name: Production services are documented
    description: Every production service should reference a runbook or approved operational document.
    severity: warning
    applies_to: [services]
    remediation: Add a DOCUMENTED_BY relationship or an operations documentation reference.

  - id: VAL-016
    name: Stateful critical services declare backup coverage
    description: Tier 0 and Tier 1 stateful services should declare a backup policy or a documented exception.
    severity: warning
    applies_to: [services]
    remediation: Add a BACKED_UP_BY relationship or record an approved exception.

  - id: VAL-017
    name: Services declare observability coverage
    description: Every service should name an authoritative log source and a health check.
    severity: warning
    applies_to: [services]
    remediation: Complete the observability block.

  - id: VAL-018
    name: No self-dependency
    description: An entity must not declare a dependency on itself.
    severity: error
    applies_to: [relationships]
    remediation: Remove the self-referencing relationship.

  - id: VAL-019
    name: Relationships are not duplicated across files
    description: A logical edge should be declared once in the canonical relationship list.
    severity: warning
    applies_to: [relationships]
    remediation: Remove the duplicate and reference the canonical relationship id.

  - id: VAL-020
    name: Entities record a last review date
    description: Entities should record when a human last confirmed their declared facts.
    severity: information
    applies_to: [roles, hosts, services]
    remediation: Set provenance.last_reviewed.

  # --- Evidence and verification layer ------------------------------------

  - id: VAL-021
    name: Evidence carries a collection timestamp
    description: Every evidence record must declare collected_at with timezone information.
    severity: error
    applies_to: [evidence]
    remediation: Add an RFC 3339 collected_at value with an explicit offset.

  - id: VAL-022
    name: Evidence contains no secret values
    description: Evidence may record secret metadata such as secret_present, never a secret value.
    severity: error
    applies_to: [evidence]
    remediation: Replace the value with a presence indicator and a secret_source reference.

  - id: VAL-023
    name: Failed collection explains itself
    description: Evidence with status failed or unavailable must carry a non-secret error summary.
    severity: error
    applies_to: [evidence]
    remediation: Add error_summary describing the failure without secret content.

  - id: VAL-024
    name: Verification references resolvable evidence
    description: Every evidence id referenced by a verification record must exist.
    severity: error
    applies_to: [verifications]
    remediation: Correct the reference or add the missing evidence record.

  - id: VAL-025
    name: Verified state requires evidence
    description: A verification in the verified state must reference at least one evidence record.
    severity: error
    applies_to: [verifications]
    remediation: Attach supporting evidence or change the state to pending or unknown.

  - id: VAL-026
    name: Stale evidence cannot produce verified state
    description: A verified state must not rest on evidence older than the rule's approved maximum age.
    severity: error
    applies_to: [verifications]
    remediation: Report stale_evidence instead of verified.

  - id: VAL-027
    name: Remediation is never automatic
    description: Drift rules may declare remediation_mode advisory or manual-approval-required only.
    severity: error
    applies_to: [drift-rules]
    remediation: Change remediation_mode; automatic is not an accepted value.

  - id: VAL-028
    name: Verification records carry no executable action
    description: Verification records must not contain fields describing high-impact actions to run.
    severity: error
    applies_to: [verifications]
    remediation: Move the suggestion into the advisory recommended_action text.

  - id: VAL-029
    name: Critical findings require approval
    description: A verification with critical severity must set approval_required.
    severity: error
    applies_to: [verifications]
    remediation: Set approval_required to true.

  - id: VAL-030
    name: Drift rules without a committed cadence are flagged
    description: A rule with a null evidence_max_age must set review_required so the gap stays visible.
    severity: warning
    applies_to: [drift-rules]
    remediation: Set review_required, or record a committed maximum age.

  # --- Capability model ----------------------------------------------------

  - id: VAL-031
    name: Capability maturity is justified
    description: A capability claiming operational or optimized maturity must name what implements and validates it.
    severity: error
    applies_to: [capabilities]
    remediation: Populate implemented_by and validated_by, or lower the maturity to match reality.

  - id: VAL-032
    name: Capability dependencies resolve
    description: Every capability listed as a dependency must exist.
    severity: error
    applies_to: [capabilities]
    remediation: Correct the reference or create the missing capability.

  - id: VAL-033
    name: Unverified capability claims are flagged
    description: A capability whose maturity is not justified by committed evidence must set review_required.
    severity: warning
    applies_to: [capabilities]
    remediation: Set review_required, or record evidence supporting the claim.

  - id: VAL-034
    name: Collector permissions stay within the trust boundary
    description: A collector manifest must request only approved permissions and none of the forbidden set.
    severity: error
    applies_to: [collectors]
    remediation: Remove the permission; granting it requires an architecture decision revisiting ADR-0002.

  - id: VAL-035
    name: Collectors declare no runtime access
    description: Collector manifests must declare network, subprocess, and filesystem access as false in this increment.
    severity: error
    applies_to: [collectors]
    remediation: Set the flags to false; live access arrives with a later, reviewed increment.

