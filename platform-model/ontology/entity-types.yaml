---
# Controlled entity vocabulary for the Schott Platform knowledge model.
#
# Type values use kebab-case and must match the Platform Ontology Standard.
# Adding a type requires a documented ontology change. Do not represent the
# same concept with two competing type names.
#
# Governed by: docs/standards/platform-ontology-standard.md

api_version: schott-platform/v1
kind: EntityTypeCatalog

provenance:
  class: declared
  source: docs/standards/platform-ontology-standard.md
  recorded_at: 2026-08-01
  last_reviewed: 2026-08-01

entity_types:
  platform:
    name: Platform
    description: The overall Schott Platform as a single governed system.
    id_prefix: PLAT
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  platform-role:
    name: Platform Role
    description: A functional classification that groups hosts and services by purpose.
    id_prefix: ROLE
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  host:
    name: Host
    description: A physical or virtual machine that runs platform workloads.
    id_prefix: HOST
    lifecycle_supported: [planned, provisioning, active, maintenance, degraded, retiring, decommissioned]

  virtual-machine:
    name: Virtual Machine
    description: A guest machine running on a compute platform host.
    id_prefix: VM
    lifecycle_supported: [planned, provisioning, active, maintenance, degraded, retiring, decommissioned]

  container:
    name: Container
    description: A container instance that runs as part of a service deployment.
    id_prefix: CTR
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  service:
    name: Service
    description: A long-lived operational workload with its own catalog record.
    id_prefix: SVC
    lifecycle_supported: [proposed, development, test, production, maintenance, deprecated, retired]

  application:
    name: Application
    description: A user-facing product built on top of platform services.
    id_prefix: APP
    lifecycle_supported: [proposed, development, test, production, maintenance, deprecated, retired]

  repository:
    name: Repository
    description: A source control repository holding platform or application code.
    id_prefix: REPO
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  playbook:
    name: Playbook
    description: An automation playbook that configures or validates platform state.
    id_prefix: PB
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  runbook:
    name: Runbook
    description: A human operational procedure for a service, host, or recovery task.
    id_prefix: RB
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  dashboard:
    name: Dashboard
    description: A visualization surface presenting service or host telemetry.
    id_prefix: DASH
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  alert:
    name: Alert
    description: A monitoring rule that notifies operators of a condition.
    id_prefix: ALERT
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  backup-policy:
    name: Backup Policy
    description: A defined protection scope, schedule, and retention for platform data.
    id_prefix: BKP
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  network:
    name: Network
    description: A logical network segment, zone, or trust boundary.
    id_prefix: NET
    lifecycle_supported: [planned, active, deprecated, retired]

  storage:
    name: Storage
    description: A persistent storage location such as a volume, dataset, or share.
    id_prefix: STOR
    lifecycle_supported: [planned, active, deprecated, retired]

  standard:
    name: Standard
    description: A governing platform standard document.
    id_prefix: STD
    lifecycle_supported: [proposed, active, deprecated, retired]

  architecture-decision:
    name: Architecture Decision
    description: A recorded architectural decision and its consequences.
    id_prefix: ADR
    lifecycle_supported: [proposed, active, deprecated, retired]

  api:
    name: API
    description: A network interface contract exposed or consumed by a service.
    id_prefix: API
    lifecycle_supported: [proposed, development, test, production, deprecated, retired]

  model:
    name: Model
    description: An AI model artifact served by an inference backend.
    id_prefix: MODEL
    lifecycle_supported: [proposed, development, test, production, deprecated, retired]

  gpu:
    name: GPU
    description: A graphics processing unit available for accelerated workloads.
    id_prefix: GPU
    lifecycle_supported: [planned, active, maintenance, degraded, retired]

  dataset:
    name: Dataset
    description: A managed collection of data used by platform or AI workloads.
    id_prefix: DS
    lifecycle_supported: [proposed, development, active, deprecated, retired]

  evidence:
    name: Evidence
    description: Immutable, timestamped support for an observed fact about an entity.
    id_prefix: EVID
    # Evidence is never revised in place; a correction supersedes it. There is
    # no "verified" evidence, because evidence is what verification consumes.
    lifecycle_supported: [declared, deprecated, archived]

  verification:
    name: Verification
    description: Read-only result of comparing a declared fact against collected evidence.
    id_prefix: VER
    lifecycle_supported: [declared, deprecated, archived]

  drift-rule:
    name: Drift Rule
    description: Declarative definition of a comparison between declared intent and observed fact.
    id_prefix: DRIFT
    lifecycle_supported: [draft, declared, verification-pending, verified, managed, deprecated, archived]

  capability:
    name: Capability
    description: Something the platform can intentionally provide, recorded with an honest implementation maturity.
    id_prefix: CAP
    lifecycle_supported: [draft, declared, verification-pending, verified, managed, active, deprecated, archived]

  observation:
    name: Observation
    description: A validated, redacted, normalized collector result, before it is given a persistent identity.
    id_prefix: OBS
    # An observation is a moment, not a thing with a life. It is created,
    # possibly superseded, and never revised.
    lifecycle_supported: [declared, deprecated, archived]

  knowledge-event:
    name: Knowledge Event
    description: An append-only record that something happened to the platform's understanding of an entity.
    id_prefix: MEM
    lifecycle_supported: [declared, archived]

  snapshot:
    name: Snapshot
    description: Immutable representation of a known-good operational state, never revised.
    id_prefix: SNAP
    lifecycle_supported: [declared, deprecated, archived]

  digital-twin:
    name: Digital Twin
    description: Disposable working reconstruction of current state, rebuilt entirely from knowledge.
    id_prefix: TWIN
    # No deprecation lifecycle: a twin is rebuilt or discarded, never aged.
    lifecycle_supported: [declared]

  integrity-report:
    name: Integrity Report
    description: Read-only comparison between a digital twin and an immutable snapshot.
    id_prefix: INTEG
    lifecycle_supported: [declared, archived]

  recovery-plan:
    name: Recovery Plan
    description: Advisory, human-readable reconstruction strategy. Never executed.
    id_prefix: RECOV
    lifecycle_supported: [declared, archived]

  experience-profile:
    name: Experience Profile
    description: Statistical summary of one metric over one window. Observed history, not a truth claim.
    id_prefix: EXP
    lifecycle_supported: [declared, archived]

  experience-window:
    name: Experience Window
    description: Bounded span of time an experience profile summarizes.
    id_prefix: WINDOW
    lifecycle_supported: [declared, archived]

  operational-baseline:
    name: Operational Baseline
    description: What has been typical for a metric. Never a statement of what is correct.
    id_prefix: BASE
    lifecycle_supported: [declared, archived]

  occurrence:
    name: Occurrence
    description: One thing that happened, at one time, cited to the record it was derived from.
    id_prefix: OCC
    lifecycle_supported: [declared, archived]

  occurrence-series:
    name: Occurrence Series
    description: Every observed occurrence of one kind for one target, with derived temporal measures.
    id_prefix: SERIES
    lifecycle_supported: [declared, archived]

  pattern:
    name: Pattern
    description: A recognised temporal shape in a series. Describes observed history, never the future.
    id_prefix: PAT
    lifecycle_supported: [declared, archived]

  timeline:
    name: Timeline
    description: An ordered view of occurrences for a target, across kinds.
    id_prefix: TL
    lifecycle_supported: [declared, archived]

  remote-target:
    name: Remote Target
    description: A host explicitly approved for read-only observation. Declared by a human; never discovered.
    id_prefix: RTGT
    lifecycle_supported: [declared, archived]

  remote-operation:
    name: Remote Operation
    description: One read-only operation the code-owned catalog defines. Describes an operation; never defines its argv.
    id_prefix: ROP
    lifecycle_supported: [declared, archived]

  trust-record:
    name: Trust Record
    description: Current standing of one subject in one domain. Superseded, never edited.
    id_prefix: TRUST
    lifecycle_supported: [declared, archived]

  trust-decision:
    name: Trust Decision
    description: One act of judgement producing one trust state. The only thing that can change standing.
    id_prefix: TDEC
    lifecycle_supported: [declared, archived]

  trust-authority:
    name: Trust Authority
    description: Entity permitted to make trust decisions in named domains. May not approve itself.
    id_prefix: TAUTH
    lifecycle_supported: [declared, archived]

  trust-policy:
    name: Trust Policy
    description: Declared defaults, permitted transitions, and review cadence for one trust domain.
    id_prefix: TPOL
    lifecycle_supported: [declared, archived]

  # --- Distributed Capability Fabric (ADR-0012) ------------------------------
  # These are executable things. The `capability` type above is a governance
  # claim about what the platform can do and carries a maturity; nothing routes
  # to it. The two concepts never share an identifier space, because the first
  # request routed to a "planned" capability discovers the difference in
  # production.

  capability-definition:
    name: Capability Definition
    description: An abstract named ability, independent of code, version, host, and hardware. The identity anchor.
    id_prefix: CAPDEF
    lifecycle_supported: [declared, archived]

  capability-contract:
    name: Capability Contract
    description: The versioned interface a capability is reached through. Version negotiation happens against contracts.
    id_prefix: CCON
    lifecycle_supported: [declared, archived]

  capability-package:
    name: Capability Package
    description: The reviewable artefact implementing a contract. Trust subject in the capability-package domain.
    id_prefix: CPKG
    lifecycle_supported: [declared, archived]

  capability-host:
    name: Capability Host
    description: A machine offering execution capacity. Trust subject in the fabric-node domain.
    id_prefix: CHOST
    lifecycle_supported: [declared, archived]

  capability-advertisement:
    name: Capability Advertisement
    description: A host's self-report about what it holds. A claim, never a grant; confers no trust and expires.
    id_prefix: CADV
    lifecycle_supported: [declared, archived]

  capability-instance:
    name: Capability Instance
    description: The admitted binding of one package to one host for one contract. The only routable thing.
    id_prefix: CINST
    lifecycle_supported: [declared, archived]

  capability-route:
    name: Capability Route
    description: Declared policy binding a request class to an explicitly ordered candidate list. Order is human-written.
    id_prefix: CROUTE
    lifecycle_supported: [declared, archived]

  capability-selection:
    name: Capability Selection
    description: One recorded act of choosing, with every candidate considered and why each was excluded.
    id_prefix: CSEL
    lifecycle_supported: [declared, archived]

  # --- Capability Health Plane (ADR-0013) ------------------------------------
  # Observation only. None of these records grants trust, confers eligibility,
  # or executes anything. Health may remove a candidate from consideration on
  # positive evidence and may do nothing else.
  #
  # The v0.9.6 reservation also named lease-health and placement-health. v0.9.5
  # deliberately defined no lease and no placement record, so both would have
  # had nothing to refer to and are deliberately absent.

  capability-health-envelope:
    name: Capability Health Envelope
    description: Declared per-dimension limits for one subject. Authored by a human; thresholds are never learned.
    id_prefix: CHENV
    lifecycle_supported: [declared, archived]

  capability-heartbeat:
    name: Capability Heartbeat
    description: A subject's liveness claim about itself. Confers no trust and no eligibility.
    id_prefix: CHBEAT
    lifecycle_supported: [declared, archived]

  capability-health-observation:
    name: Capability Health Observation
    description: One measurement of one dimension at one moment. Evidence, carrying no verdict.
    id_prefix: CHOBS
    lifecycle_supported: [declared, archived]

  capability-health-state:
    name: Capability Health State
    description: Deterministic derived standing of one subject, citing the observations behind it.
    id_prefix: CHSTATE
    lifecycle_supported: [declared, archived]

  capability-degradation-event:
    name: Capability Degradation Event
    description: A recorded transition between health states. Describes observed history, never the future.
    id_prefix: CHDEG
    lifecycle_supported: [declared, archived]

  capability-health-recommendation:
    name: Capability Health Recommendation
    description: A record asking a human to investigate or drain. Never an action, never executed automatically.
    id_prefix: CHREC
    lifecycle_supported: [declared, archived]
