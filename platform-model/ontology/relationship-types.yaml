---
# Controlled relationship vocabulary for the Schott Platform knowledge model.
#
# Relationships are directed edges between two existing entities. Synonyms must
# not be added when an existing relationship already expresses the meaning.
#
# `inverse` names the reciprocal relationship. Only one direction is stored as
# canonical; the inverse may be derived. `transitive` indicates whether the
# relationship may be chained during inference.
#
# Governed by: docs/standards/platform-ontology-standard.md

api_version: schott-platform/v1
kind: RelationshipTypeCatalog

provenance:
  class: declared
  source: docs/standards/platform-ontology-standard.md
  recorded_at: 2026-08-01
  last_reviewed: 2026-08-01

relationship_types:
  BELONGS_TO:
    name: Belongs To
    description: The source entity is classified under the target grouping.
    allowed_sources: [host, virtual-machine, service, application, container]
    allowed_targets: [platform-role, platform]
    transitive: false
    inverse: HOSTS
    operational_impact: Determines role-based automation, monitoring, and policy targeting.

  RUNS_ON:
    name: Runs On
    description: The source workload executes on the target deployment target.
    # capability-instance and capability-host are permitted rather than given a
    # synonym relationship: an instance executing on a host is exactly what
    # RUNS_ON already means, and the ontology forbids competing names for one
    # meaning. An instance is bound to exactly one host and dies with it.
    allowed_sources: [service, application, container, virtual-machine, capability-instance]
    allowed_targets: [host, virtual-machine, container, capability-host]
    transitive: true
    inverse: HOSTS
    operational_impact: Loss of the target removes the source workload.

  HOSTS:
    name: Hosts
    description: The source deployment target runs the target workload.
    allowed_sources: [host, virtual-machine, container, platform-role]
    allowed_targets: [service, application, container, virtual-machine]
    transitive: true
    inverse: RUNS_ON
    operational_impact: Identifies blast radius when the source is restarted or lost.

  DEPENDS_ON:
    name: Depends On
    description: The source requires the target to function correctly.
    # host is an allowed target because inference rule INF-001 derives an
    # indirect service-to-host dependency; without it the ontology forbids an
    # edge its own inference rules produce.
    # backup-policy is an allowed source because a policy cannot execute when
    # the host holding its datastore is unavailable.
    allowed_sources: [service, application, container, api, backup-policy]
    allowed_targets: [service, application, container, api, storage, network, model, gpu, host]
    transitive: true
    inverse: null
    operational_impact: Loss of the target may degrade or disable the source.

  PROVIDES:
    name: Provides
    description: The source offers the target interface or capability.
    allowed_sources: [service, application, host]
    allowed_targets: [api, model, storage, dataset]
    transitive: false
    inverse: CONSUMES
    operational_impact: Identifies which consumers are affected by source changes.

  CONSUMES:
    name: Consumes
    description: The source uses the target interface or capability.
    allowed_sources: [service, application, api]
    allowed_targets: [api, model, storage, dataset]
    transitive: false
    inverse: PROVIDES
    operational_impact: Identifies upstream contracts the source relies on.

  CONNECTS_TO:
    name: Connects To
    description: The source attaches to the target network segment or endpoint.
    # backup-policy and storage are permitted so a policy can name the
    # datastore it writes to. This is attachment, not data ownership:
    # STORES_DATA_ON remains the relationship for a workload's own persistence.
    allowed_sources: [host, virtual-machine, container, service, backup-policy]
    allowed_targets: [network, service, api, storage]
    transitive: false
    inverse: null
    operational_impact: Determines reachability and firewall policy relevance.

  STORES_DATA_ON:
    name: Stores Data On
    description: The source persists data on the target storage entity.
    allowed_sources: [service, application, container, host]
    allowed_targets: [storage, dataset]
    transitive: false
    inverse: null
    operational_impact: Loss of the target risks data loss for the source.

  MONITORED_BY:
    name: Monitored By
    description: The source is observed by the target dashboard or monitoring surface.
    allowed_sources: [service, application, host, virtual-machine, container]
    allowed_targets: [dashboard, service]
    transitive: false
    inverse: null
    operational_impact: Absence indicates an observability gap.

  LOGGED_TO:
    name: Logged To
    description: The source sends logs to the target destination.
    allowed_sources: [service, application, host, virtual-machine, container]
    allowed_targets: [service, storage]
    transitive: false
    inverse: null
    operational_impact: Identifies where diagnostic evidence is retrievable.

  TRACED_BY:
    name: Traced By
    description: The source emits distributed traces to the target system.
    allowed_sources: [service, application, api]
    allowed_targets: [service]
    transitive: false
    inverse: null
    operational_impact: Supports latency and dependency-path analysis.

  ALERTED_BY:
    name: Alerted By
    description: The source has alerting coverage from the target alert rule.
    allowed_sources: [service, application, host, virtual-machine]
    allowed_targets: [alert]
    transitive: false
    inverse: null
    operational_impact: Absence means failures may go unnoticed.

  BACKED_UP_BY:
    name: Backed Up By
    description: The source is protected by the target backup policy.
    allowed_sources: [service, application, host, virtual-machine, storage, dataset]
    allowed_targets: [backup-policy]
    transitive: false
    inverse: PROTECTED_BY
    operational_impact: Absence on a Tier 0 or Tier 1 stateful entity is a coverage gap.

  RECOVERED_BY:
    name: Recovered By
    description: The source is restored using the target procedure.
    allowed_sources: [service, application, host, virtual-machine, storage]
    allowed_targets: [runbook, playbook, backup-policy]
    transitive: false
    inverse: null
    operational_impact: Defines the approved recovery path and ordering.

  DEPLOYED_BY:
    name: Deployed By
    description: The source is installed or configured by the target automation.
    allowed_sources: [service, application, container, host, virtual-machine]
    allowed_targets: [playbook, repository]
    transitive: false
    inverse: null
    operational_impact: Identifies the authoritative change mechanism.

  GOVERNED_BY:
    name: Governed By
    description: The source must comply with the target standard or decision.
    allowed_sources: [platform, platform-role, host, virtual-machine, service, application, network, storage, container, api]
    allowed_targets: [standard, architecture-decision]
    transitive: false
    inverse: null
    operational_impact: Defines the compliance criteria applied during review.

  DOCUMENTED_BY:
    name: Documented By
    description: The source has operational documentation in the target.
    allowed_sources: [platform-role, host, virtual-machine, service, application, network, storage]
    allowed_targets: [runbook, standard, architecture-decision, repository]
    transitive: false
    inverse: null
    operational_impact: Absence on a production service is a compliance failure.

  AUTOMATED_BY:
    name: Automated By
    description: The source is managed by the target automation asset.
    allowed_sources: [host, virtual-machine, service, application, network]
    allowed_targets: [playbook, repository]
    transitive: false
    inverse: null
    operational_impact: Indicates whether changes are reproducible.

  VALIDATED_BY:
    name: Validated By
    description: The source is verified by the target test or compliance check.
    allowed_sources: [platform, platform-role, host, virtual-machine, service, application, network]
    allowed_targets: [playbook, repository, runbook]
    transitive: false
    inverse: null
    operational_impact: Identifies the evidence supporting a compliance claim.

  PROTECTED_BY:
    name: Protected By
    description: The source is safeguarded by the target control or policy.
    allowed_sources: [host, virtual-machine, service, application, network, storage, dataset]
    allowed_targets: [standard, backup-policy, service, network]
    transitive: false
    inverse: BACKED_UP_BY
    operational_impact: Identifies the control reducing exposure or data-loss risk.

  OWNS:
    name: Owns
    description: The source is accountable for the target entity outcome.
    allowed_sources: [platform-role, platform]
    allowed_targets: [host, virtual-machine, service, application, storage, network, dataset]
    transitive: false
    inverse: null
    operational_impact: Establishes accountability for operational decisions.

  MANAGES:
    name: Manages
    description: The source performs administrative control over the target.
    allowed_sources: [host, virtual-machine, service, playbook]
    allowed_targets: [host, virtual-machine, service, container, network]
    transitive: false
    inverse: null
    operational_impact: Identifies control-plane reach and privilege boundaries.

  REQUIRES:
    name: Requires
    description: The source needs the target resource to operate.
    allowed_sources: [service, application, container, host, virtual-machine]
    allowed_targets: [gpu, storage, network, model, dataset]
    transitive: false
    inverse: null
    operational_impact: Loss of the target prevents the source from operating.

  # --- Evidence and verification layer ------------------------------------
  # These describe how a claim was checked. None of them imply or authorize a
  # corrective action: detection stays separate from remediation.

  SUPPORTED_BY:
    name: Supported By
    description: The source verification rests on the target evidence record.
    # Evidence is a leaf: it supports conclusions, it is not supported by them.
    # EVID-0001 SUPPORTED_BY ... is therefore invalid and rejected.
    allowed_sources: [verification]
    allowed_targets: [evidence]
    transitive: false
    inverse: null
    operational_impact: Identifies what a finding actually rests on; absence makes the finding unfalsifiable.

  VERIFIED_BY:
    name: Verified By
    description: The source entity has been evaluated by the target verification record.
    allowed_sources: [host, virtual-machine, service, application, container, network, storage, backup-policy, platform-role]
    allowed_targets: [verification]
    transitive: false
    inverse: EVALUATES
    operational_impact: Absence means the entity is declared but unchecked.

  EVALUATES:
    name: Evaluates
    description: The source verification assesses the target entity.
    allowed_sources: [verification]
    allowed_targets: [host, virtual-machine, service, application, container, network, storage, backup-policy, platform-role]
    transitive: false
    inverse: VERIFIED_BY
    operational_impact: Establishes which entity a finding is about.

  DETECTS_DRIFT_IN:
    name: Detects Drift In
    description: >-
      The source drift rule applies to the target entity. Rule applicability to
      an entity *type* is expressed through the rule's target_entity_types
      metadata, not as an edge to a type definition.
    allowed_sources: [drift-rule]
    allowed_targets: [host, virtual-machine, service, application, container, network, storage, backup-policy, platform-role]
    transitive: false
    inverse: null
    operational_impact: Identifies coverage; an entity no rule targets is unchecked.

  SUPERSEDES:
    name: Supersedes
    description: The source record replaces the target while the target is retained for history.
    allowed_sources: [evidence, verification]
    allowed_targets: [evidence, verification]
    transitive: true
    inverse: null
    operational_impact: Preserves correction history without destroying the original observation.

  # --- Capability model ----------------------------------------------------
  # A capability describes what the platform can do. None of these edges grants
  # authority to do anything: capability is a description, not a permission.

  IMPLEMENTED_BY:
    name: Implemented By
    description: The source capability is realised by the target component.
    allowed_sources: [capability]
    allowed_targets: [service, application, repository, playbook, api, standard]
    transitive: false
    inverse: PROVIDES_CAPABILITY
    operational_impact: A capability with no implementation cannot be operational, whatever its record claims.

  PROVIDES_CAPABILITY:
    name: Provides Capability
    description: The source component realises the target capability.
    allowed_sources: [service, application, repository, playbook, api, host, platform-role]
    allowed_targets: [capability]
    transitive: false
    inverse: IMPLEMENTED_BY
    operational_impact: Identifies what would be lost if the source were removed.

  REQUIRES_CAPABILITY:
    name: Requires Capability
    description: The source depends on the target capability being available.
    allowed_sources: [capability, service, application]
    allowed_targets: [capability]
    transitive: true
    inverse: null
    operational_impact: A capability may be no more mature than the capabilities it requires.

  APPROVED_BY:
    name: Approved By
    description: >-
      The source required and received explicit human approval recorded in the
      target. Records that approval happened; confers no authority to act.
    allowed_sources: [capability, verification, drift-rule]
    allowed_targets: [standard, architecture-decision, runbook]
    transitive: false
    inverse: null
    operational_impact: Absence on a high-impact capability means nothing gated it.


  DERIVED_FROM:
    name: Derived From
    description: >-
      The source was computed from the target. Records provenance for anything
      inferred, so a conclusion can always be traced back to its inputs.
    allowed_sources: [verification, knowledge-event, observation]
    allowed_targets: [evidence, observation, verification]
    transitive: true
    inverse: null
    operational_impact: A derived fact is only as trustworthy as what it was derived from.

  REFRESHES:
    name: Refreshes
    description: >-
      The source re-confirmed the target without changing it. Records that a
      fact was observed again, which updates freshness and creates no new
      evidence.
    allowed_sources: [observation, knowledge-event]
    allowed_targets: [evidence]
    transitive: false
    inverse: null
    operational_impact: Absence over time means a fact is aging even though nothing contradicts it.

  SUPERSEDES:
    name: Supersedes
    description: >-
      The source replaces the target as the current record of a fact. The
      superseded record remains readable; correction never edits in place.
    allowed_sources: [evidence, verification]
    allowed_targets: [evidence, verification]
    transitive: true
    inverse: null
    operational_impact: The superseded record stays citable, so past conclusions remain legible.

  SUPPORTS_KNOWLEDGE:
    name: Supports Knowledge
    description: >-
      The source evidence contributes to a derived conclusion about the target.
      Confers no authority to change the target.
    allowed_sources: [evidence, verification]
    allowed_targets: [host, service, application, container, network, storage, backup-policy, repository, capability]
    transitive: false
    inverse: null
    operational_impact: A conclusion with no supporting evidence is an opinion, not a finding.

  RECORDED_IN:
    name: Recorded In
    description: The source fact is durably recorded in the target append-only event.
    allowed_sources: [evidence, verification]
    allowed_targets: [knowledge-event]
    transitive: false
    inverse: null
    operational_impact: Identifies where the audit trail for a conclusion lives.

  SNAPSHOT_OF:
    name: Snapshot Of
    description: >-
      The source snapshot records a known-good observed state of the target
      entity. Records observation, never intent, and confers no authority over
      the target's declared configuration.
    allowed_sources: [snapshot]
    allowed_targets: [host, service, application, container, network, storage, backup-policy, repository]
    transitive: false
    inverse: null
    operational_impact: Provides the reference point an integrity comparison is measured against.

  RECONSTRUCTED_FROM:
    name: Reconstructed From
    description: >-
      The source digital twin was rebuilt entirely from the target knowledge or
      evidence. A twin has no content of its own.
    allowed_sources: [digital-twin]
    allowed_targets: [evidence, verification, knowledge-event]
    transitive: false
    inverse: null
    operational_impact: A twin is only as trustworthy as the knowledge it was rebuilt from.

  COMPARED_AGAINST:
    name: Compared Against
    description: The source integrity report compared a digital twin against the target snapshot.
    allowed_sources: [integrity-report]
    allowed_targets: [snapshot]
    transitive: false
    inverse: null
    operational_impact: Identifies which reference point a finding was measured against.

  RECOMMENDS_RECONSTRUCTION:
    name: Recommends Reconstruction
    description: >-
      The source recovery plan advises reconstruction toward the target
      snapshot. Advisory only: this relationship confers no authority to act,
      and detected drift may be intended change.
    allowed_sources: [recovery-plan]
    allowed_targets: [snapshot]
    transitive: false
    inverse: null
    operational_impact: Records advice a human may accept or reject; nothing acts on it.

  SUMMARIZES:
    name: Summarizes
    description: >-
      The source experience profile statistically summarizes observations of
      the target entity. Records what was seen, never what is correct.
    allowed_sources: [experience-profile]
    allowed_targets: [host, service, application, container, network, storage, backup-policy, repository]
    transitive: false
    inverse: null
    operational_impact: Provides the operational history a behavioural comparison is measured against.

  DERIVED_FROM_WINDOW:
    name: Derived From Window
    description: The source profile or baseline was computed over the target time window.
    allowed_sources: [experience-profile, operational-baseline]
    allowed_targets: [experience-window]
    transitive: false
    inverse: null
    operational_impact: A summary is only as representative as the window it covers.

  ESTABLISHES_BASELINE:
    name: Establishes Baseline
    description: >-
      The source profile contributes to the target baseline. Contributing to
      what is typical confers no authority over what is correct.
    allowed_sources: [experience-profile]
    allowed_targets: [operational-baseline]
    transitive: false
    inverse: null
    operational_impact: Identifies which observations a notion of normal rests on.

  OCCURRED_ON:
    name: Occurred On
    description: >-
      The source occurrence happened to the target entity. Records when
      something happened; confers no authority over the target.
    allowed_sources: [occurrence]
    allowed_targets: [host, service, application, container, network, storage, backup-policy, repository]
    transitive: false
    inverse: null
    operational_impact: Provides the temporal history an incident review reads.

  DERIVED_FROM_EVIDENCE:
    name: Derived From Evidence
    description: >-
      The source occurrence was derived from the target evidence record. Every
      temporal claim traces back to an observation.
    allowed_sources: [occurrence]
    allowed_targets: [evidence, knowledge-event]
    transitive: false
    inverse: null
    operational_impact: An occurrence is only as trustworthy as the evidence behind it.

  MEMBER_OF_SERIES:
    name: Member Of Series
    description: The source occurrence is one of the occurrences the target series summarizes.
    allowed_sources: [occurrence]
    allowed_targets: [occurrence-series]
    transitive: false
    inverse: null
    operational_impact: Identifies which observations a temporal summary rests on.

  DETECTED_IN:
    name: Detected In
    description: >-
      The source pattern was recognised in the target series. Names a shape
      that has been observed, never one expected to continue.
    allowed_sources: [pattern]
    allowed_targets: [occurrence-series]
    transitive: false
    inverse: null
    operational_impact: A pattern with no series behind it cannot be checked.

  ORDERED_IN:
    name: Ordered In
    description: The source occurrence appears at a position in the target timeline.
    allowed_sources: [occurrence]
    allowed_targets: [timeline]
    transitive: false
    inverse: null
    operational_impact: Establishes the sequence an operator reads during review.

  TARGETS:
    name: Targets
    description: >-
      The source collector or collection attempt observes the target remote
      host. Observation only: this relationship never implies the platform
      administers, depends on, or places work on the host.
    allowed_sources: [collector, evidence]
    allowed_targets: [remote-target]
    transitive: false
    inverse: null
    operational_impact: Records which machines the platform has been approved to look at.

  PERMITS_OPERATION:
    name: Permits Operation
    description: >-
      The source remote target authorizes the target remote operation. This is
      the authorization boundary: an operation absent here cannot be run
      against that host, whatever a collector asks for.
    allowed_sources: [remote-target]
    allowed_targets: [remote-operation]
    transitive: false
    inverse: null
    operational_impact: Bounds what can happen on a remote machine to a reviewed list.

  COLLECTS_FROM:
    name: Collects From
    description: >-
      The source evidence record was derived from observation of the target
      remote host. Present so a remote-derived fact is never mistaken for a
      locally observed one.
    allowed_sources: [evidence, observation]
    allowed_targets: [remote-target]
    transitive: false
    inverse: null
    operational_impact: Distinguishes what was seen on another machine from what was seen here.

  TRUSTS:
    name: Trusts
    description: >-
      The source trust record establishes standing for the target subject.
      Never inferred: a trust record exists only because a decision created it.
      A reasoning record may never be the source, or inference would be able to
      manufacture its own authority.
    allowed_sources: [trust-record]
    allowed_targets: [host, service, capability, collector, remote-target, remote-operation]
    transitive: false
    inverse: null
    operational_impact: Records what the platform is permitted to rely on, and why.

  VERIFIED_BY:
    name: Verified By
    description: >-
      The source trust decision rested on the target evidence, checked by a
      named verification method. Evidence is referenced, never inlined.
    allowed_sources: [trust-decision, trust-record]
    allowed_targets: [evidence, verification]
    transitive: false
    inverse: null
    operational_impact: Distinguishes a checked assertion from an assumed one.

  APPROVED_BY:
    name: Approved By
    description: >-
      The source decision, record, authority, or policy was authorised by the
      target trust authority. Self-approval is not permitted: the chain must
      terminate outside the thing being established.
    allowed_sources: [trust-decision, trust-record, trust-authority, trust-policy]
    allowed_targets: [trust-authority]
    transitive: false
    inverse: null
    operational_impact: Answers who authorised a grant, separately from who performed it.

  REVOKES:
    name: Revokes
    description: >-
      The source decision withdraws the target trust record. Terminal for that
      record: the subject may be trusted again only by a new decision producing
      a new record. Revocation never deletes anything.
    allowed_sources: [trust-decision]
    allowed_targets: [trust-record]
    transitive: false
    inverse: null
    operational_impact: Makes withdrawal a recorded act rather than an edit.

  SUPERSEDES:
    name: Supersedes
    description: >-
      The source record replaces the target record, which remains readable.
      This is how trust changes: correction is supersession, because an
      editable audit trail can be rewritten after the fact.
    # Fabric records supersede the same way, and for the same reason: a new
    # package version is a new subject, and cutover is a new route version
    # rather than an edit to the old one.
    allowed_sources: [trust-record, trust-decision, trust-authority, trust-policy,
                      capability-definition, capability-contract, capability-package,
                      capability-host, capability-advertisement, capability-instance,
                      capability-route]
    allowed_targets: [trust-record, trust-decision, trust-authority, trust-policy,
                      capability-definition, capability-contract, capability-package,
                      capability-host, capability-advertisement, capability-instance,
                      capability-route]
    transitive: true
    inverse: null
    operational_impact: Preserves what was trusted at any past moment.

  DERIVED_FROM:
    name: Derived From
    description: >-
      The source trust record was established from the target source material -
      a signed release, an offline authority, a documented out-of-band
      verification. Names the origin of an assertion, distinct from the actor
      who acted on it.
    allowed_sources: [trust-record, trust-decision]
    allowed_targets: [evidence, configuration-snapshot, capability]
    transitive: false
    inverse: null
    operational_impact: Separates where an assertion came from and who recorded it.

  PROTECTED_BY:
    name: Protected By
    description: >-
      The source subject is governed by the target trust policy or authority.
      Present so that an ungoverned subject is visible as ungoverned rather
      than merely unlisted.
    allowed_sources: [host, service, capability, collector, remote-target, model, trust-record]
    allowed_targets: [trust-policy, trust-authority]
    transitive: false
    inverse: null
    operational_impact: Shows which governance applies before a subject is used.

  # --- Distributed Capability Fabric (ADR-0012) ------------------------------
  # None of these edges grants authority. Eligibility comes from the Trust
  # Plane; these edges describe how the fabric's records relate, and the
  # separations between them are what let a capability survive host migration.
  #
  # Deliberately absent: PLACES_WORKLOAD, LEASES, SCHEDULES_ON. There is no
  # scheduler in this release, so acquiring its vocabulary would claim more
  # than was built.

  CONTRACT_FOR:
    name: Contract For
    description: >-
      The source contract defines a versioned interface for the target
      capability. A capability may have many contract versions; the capability
      identity does not change when one is added.
    allowed_sources: [capability-contract]
    allowed_targets: [capability-definition]
    transitive: false
    inverse: HAS_CONTRACT
    operational_impact: Identifies which interfaces a consumer may negotiate against.

  HAS_CONTRACT:
    name: Has Contract
    description: The source capability is reached through the target contract version.
    allowed_sources: [capability-definition]
    allowed_targets: [capability-contract]
    transitive: false
    inverse: CONTRACT_FOR
    operational_impact: A capability with no contract cannot be called at all.

  IMPLEMENTS_CONTRACT:
    name: Implements Contract
    description: >-
      The source package claims to satisfy the target contract at explicitly
      declared versions. A claim about an interface, never a grant of trust in
      the package making it.
    allowed_sources: [capability-package]
    allowed_targets: [capability-contract]
    transitive: false
    inverse: null
    operational_impact: Version negotiation resolves against this declaration, never against a version number.

  ADVERTISES:
    name: Advertises
    description: >-
      The source host published the target self-report. The advertisement is a
      claim: it confers no trust, creates no eligibility, and admits nothing,
      including itself.
    allowed_sources: [capability-host]
    allowed_targets: [capability-advertisement]
    transitive: false
    inverse: ADVERTISED_BY
    operational_impact: Absence means the capability is absent, never that it is probably still there.

  ADVERTISED_BY:
    name: Advertised By
    description: The source self-report was published by the target host.
    allowed_sources: [capability-advertisement]
    allowed_targets: [capability-host]
    transitive: false
    inverse: ADVERTISES
    operational_impact: Names whose claim this was, so an unverified claim stays attributable.

  ADMITTED_AS:
    name: Admitted As
    description: >-
      The source advertisement was corroborated and admitted as the target
      instance by a human-approved decision. This edge is the only path from a
      claim to something routable, and it never forms automatically.
    allowed_sources: [capability-advertisement]
    allowed_targets: [capability-instance]
    transitive: false
    inverse: null
    operational_impact: Marks where a self-report stopped being taken at face value.

  ROUTES_TO:
    name: Routes To
    description: >-
      The source route lists the target instance as a candidate, at a declared
      position. Only admitted instances are routable; a route may never target
      an advertisement.
    allowed_sources: [capability-route]
    allowed_targets: [capability-instance]
    transitive: false
    inverse: ROUTED_BY
    operational_impact: Defines the complete candidate set; nothing outside it ever receives work.

  ROUTED_BY:
    name: Routed By
    description: The source instance is a declared candidate of the target route.
    allowed_sources: [capability-instance]
    allowed_targets: [capability-route]
    transitive: false
    inverse: ROUTES_TO
    operational_impact: Shows what would stop being reachable if the instance were removed.

  SELECTS:
    name: Selects
    description: >-
      The source selection record chose the target instance for one request.
      The record also names every candidate excluded and why, so the decision
      stays reconstructable after the route changes.
    allowed_sources: [capability-selection]
    allowed_targets: [capability-instance]
    transitive: false
    inverse: null
    operational_impact: Answers "why did this run there?" from records rather than logs.
