id: NET-0002
type: network
name: Management Address Pool
slug: management-address-pool
lifecycle: active
scope: management
range: 192.168.86.2-192.168.86.99

provenance:
  class: declared
  source: docs/architecture/network-architecture.md
  recorded_at: 2026-08-01
  last_reviewed: 2026-08-01

purpose: >-
  Administrative systems and infrastructure services. Administrative access must originate from an explicitly approved host in this pool; membership in the broader /24 does not by itself authorize SSH.

notes: >-
  UFW cannot express this pool as a single source expression. Per-host rules are required until a management VLAN provides a dedicated CIDR. This record declares policy intent and does not modify firewall rules.

