---
# schai — AI Platform reference host.
#
# All facts in this record are declared intent from the repository, not live
# observation. Volatile values such as kernel version, uptime, disk usage,
# container ids, image ids, and lease state are deliberately absent; the
# retrieval commands below obtain them at the time they are needed.
#
# Governed by:
#   docs/standards/platform-role-host-classification-standard.md
#   docs/standards/operational-metadata-standard.md

api_version: schott-platform/v1
kind: Host

id: HOST-0001
type: host
name: schai
hostname: schai
slug: schai
# Host lifecycle uses the host vocabulary from the Platform Role and Host
# Classification Standard. "production" is an environment, not a lifecycle state.
lifecycle: active
owner: platform-engineering
platform_role: ROLE-0001
environment: production
criticality: tier-1

provenance:
  class: declared
  source: docs/decisions/ADR-0001-schai-reference-host.md
  recorded_at: 2026-08-01
  last_reviewed: 2026-08-01

classification:
  primary_role: ROLE-0001
  secondary_functions: []
  recovery_priority: 2
  data_classification: internal
  role_drift: none-declared

platform:
  operating_system: Ubuntu
  release: "24.04"
  timezone: America/Chicago
  container_runtime: docker
  orchestration: docker-compose-v2
  deployment_path: /opt/schott-platform
  notes: >-
    The running kernel, package levels, and patch state are deliberately not
    declared here because they change without a model change. Retrieve them
    with the commands under verification.

hardware:
  gpu:
    vendor: NVIDIA
    model: Tesla P4
    count: 1
    passthrough: nvidia-container-runtime
    notes: >-
      Declared capability only. Current utilization, temperature, and driver
      version are runtime facts and are not recorded as declared values.

management:
  classification: management-plane-restricted
  administrative_access: ssh-key-only
  root_login: disabled
  approved_management_source: 192.168.86.2-192.168.86.99
  application_source_scope: 192.168.86.0/24
  firewall_note: >-
    Firewall rules are applied manually by an operator. Automation must not
    modify host firewall rules.
  references:
    - docs/security/network-policy.md
    - docs/standards/linux-server-security-standard.md

observability:
  authoritative_logs: journald
  log_command: journalctl --since "-1 hour"
  authentication_log_command: journalctl --unit ssh --since "-1 hour"
  container_log_source: docker
  container_log_command: docker compose --env-file ai/.env -f ai/compose.yaml logs --tail=200
  metrics_endpoint: not-deployed
  dashboards: []
  alerts: []
  notes: >-
    Centralized metrics and log shipping are planned but not deployed. Until
    then, journald and Docker are the authoritative sources on the host.

verification:
  host_health_command: uptime
  gpu_health_command: nvidia-smi
  disk_command: df -h /
  kernel_command: uname -r
  platform_health_command: ./scripts/health-check.sh
  deep_health_command: ./scripts/health-check.sh --deep
  notes: >-
    These commands retrieve runtime facts on demand. Their output must be
    recorded as an observed fact with observed_at if it is stored in the model.

security:
  hardening_standard: docs/standards/linux-server-security-standard.md
  ssh_authentication: public-key
  ssh_root_login: disabled
  secret_source: ai/.env
  secret_handling: >-
    Local environment files are never committed. The model records the secret
    source path only, never a secret value.
  log_rotation: docker-json-file-rotation-enforced
  exceptions: []

backup:
  configuration_backup: scripts/backup-config.sh
  configuration_scope: Repository configuration and local environment files.
  excluded:
    - Model blobs
    - Secrets
    - Container logs
  recovery_reference: docs/operations/recovery.md

documentation:
  install: docs/operations/install.md
  operations: docs/operations/operations.md
  recovery: docs/operations/recovery.md
  acceptance: docs/operations/acceptance-results.md
  architecture: docs/architecture/ai-platform.md

standards:
  - docs/standards/platform-role-host-classification-standard.md
  - docs/standards/linux-server-security-standard.md
  - docs/standards/docker-platform-standard.md
  - docs/standards/platform-filesystem-observability-standard.md
  - docs/standards/operational-metadata-standard.md

architecture_decisions:
  - docs/decisions/ADR-0001-schai-reference-host.md

relationships:
  canonical_source: platform-model/relationships/ai-platform.yaml
  declared:
    - REL-0001
