---
# Optional pre-commit hooks for the Schott Platform.
#
# Installation is optional and never automatic:
#
#     python3 -m pip install pre-commit
#     pre-commit install
#
# Every hook below uses `repo: local` and calls a script that already lives in
# this repository. No external hook repository is referenced.
#
# That constraint is deliberate. The usual pre-commit configuration pulls hooks
# from third-party Git repositories pinned by tag, and a tag can be moved. Every
# GitHub Action in this repository is pinned by commit SHA precisely to avoid
# that class of supply-chain exposure, and a convenience hook is a poor reason
# to reintroduce it.
#
# These hooks are deliberately fast. The full suite is NOT run on every commit:
# a pre-commit hook that takes minutes gets bypassed with --no-verify, and a
# check that is routinely bypassed protects nothing. Run the full validation
# before pushing:
#
#     tools/dev/run-validation.sh

repos:
  - repo: local
    hooks:
      - id: shell-syntax
        name: shell syntax (bash -n)
        entry: bash -n
        language: system
        files: '\.sh$'

      - id: shellcheck-pinned
        name: shellcheck (pinned 0.9.0)
        entry: tools/dev/run-shellcheck.sh
        language: system
        pass_filenames: false
        files: '\.sh$'

      - id: whitespace
        name: whitespace (git diff --check)
        entry: git diff --check
        language: system
        pass_filenames: false
        always_run: true

      - id: no-tracked-bytecode
        name: no tracked Python bytecode
        entry: bash -c 'test -z "$(git ls-files ''*__pycache__*'' ''*.pyc'')" || { echo "tracked Python bytecode found" >&2; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true

      - id: static-assertions
        name: static repository assertions
        entry: bash tests/test-static.sh
        language: system
        pass_filenames: false
        files: '^(tools/|tests/|docs/|platform-model/|ai/|\.github/)'
