# Secret scanning with Gitleaks in repository mode. Fails on verified leaks and
# ignores nothing by default (no .gitleaks.toml allowlist is committed).
# Reproduce locally with:
#   gitleaks detect --source . --redact --verbose
name: Gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          # Full history so commit-level scanning covers the whole repository.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository-wide scan; a verified leak fails the job (default behavior).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
