# Secret scanning with Gitleaks in repository mode. Fails on verified leaks and
# ignores nothing by default (no .gitleaks.toml allowlist is committed).
# Reproduce locally with:
#   gitleaks detect --source . --redact --verbose
name: Gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository (full history)
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history so commit-level scanning covers the whole repository.
          fetch-depth: 0

      - name: Run Gitleaks
        # gitleaks/gitleaks-action v2.3.9
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository-wide scan; a verified leak fails the job (default behavior).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
