# Runs ShellCheck against every repository shell script. Warnings are NOT
# suppressed globally; if a specific finding ever needs an exclusion, add a
# scoped `# shellcheck disable=SCxxxx` with a justification in the script itself
# rather than disabling checks here. Reproduce locally with:
#   shellcheck scripts/*.sh tests/*.sh
name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # shellcheck is preinstalled on ubuntu-24.04, so this matches local use.
      - name: Run ShellCheck on all shell scripts
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/*.sh
