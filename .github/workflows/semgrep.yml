# Static analysis with Semgrep using its default security rules. Findings fail
# the job (`--error`). Semgrep is pinned to version 1.171.0 by an immutable
# container digest. Reproduce locally with the SAME pinned image:
#   docker run --rm -v "$PWD:/src" -w /src \
#     semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8 \
#     semgrep scan --config auto --error
name: Semgrep

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    # Official Semgrep image (v1.171.0), pinned by immutable digest.
    container:
      image: semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Semgrep reports everything it finds; tools/dev/check-semgrep-findings.py
      # decides whether what it found is exactly what a reviewer already looked
      # at and accepted. `--error` cannot express "this one finding, in this one
      # place, for this one reason", and the alternatives are both too broad:
      # --exclude-rule silences a rule everywhere, and an inline nosemgrep would
      # change the digest of a governed installed-runtime object.
      #
      # An exception matches only on rule id, path, line and the file's current
      # sha256 together, so it cannot broaden; and an exception matching nothing
      # fails too, so a finding that goes away has to be removed deliberately.
      - name: Run Semgrep (default security rules)
        run: |
          set -o pipefail
          semgrep scan --config auto --json --quiet \
            | python3 tools/dev/check-semgrep-findings.py
