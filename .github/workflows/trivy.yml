# Trivy filesystem scan of the repository for HIGH and CRITICAL findings
# (misconfigurations, vulnerabilities, and secrets in files). No image scanning
# yet — images are scanned in a later phase. Reproduce locally with:
#   trivy fs --severity HIGH,CRITICAL --exit-code 1 .
#
# trivy-action is pinned to v0.36.0 by commit SHA. Per Aqua's 2026 advisory,
# trivy-action releases BEFORE 0.35.0 were affected by a supply-chain
# compromise; 0.36.0 is a safe post-advisory release.
name: Trivy

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Trivy filesystem scan (HIGH,CRITICAL)
        # aquasecurity/trivy-action v0.36.0 (safe release, >= 0.35.0)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          # Fail the job on any finding at the configured severity.
          exit-code: "1"
          ignore-unfixed: "false"
          # Skip local, non-source caches that are not part of the repository.
          skip-dirs: backups,logs,models,data
