# Primary validation workflow. Automates the SAME checks a developer runs
# locally (see docs/development/local-validation.md) — it invents no CI-only
# behavior. Every step here is reproducible on a workstation.
name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# Cancel superseded runs for the same ref to avoid duplicate work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history, because the generation-5 installer suite builds its
          # generation-4 fixture baseline from pinned historical blobs rather
          # than from whatever generation the machine happens to have installed.
          # The default depth-1 checkout would leave those objects absent and
          # the suite would fail closed on every run.
          fetch-depth: 0

      - name: Shell syntax check (scripts, tests, operator tooling)
        run: |
          bash -n scripts/*.sh
          bash -n tests/*.sh
          bash -n provisioning/execution/*.sh
          bash -n provisioning/artifacts/*.sh
          bash -n provisioning/evidence/*.sh

      # What this job does NOT prove. Fifteen suites test the accepted production
      # host -- operator ceremonies pinned to /opt/schott-platform, and the
      # installed Generation-12 runtime -- and report HOST_ONLY_SKIP here rather
      # than failing. Publishing the list means a green run cannot be mistaken
      # for coverage it does not have. test-static.sh asserts this manifest
      # matches the suites that actually declare themselves host-only.
      - name: Declare host-only coverage
        run: |
          printf '## Host-only suites (not proven by GitHub CI)\n\n' >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          printf 'These %d suites require the accepted production host and are\n' \
            "$(grep -cvE '^#|^$' tests/host-only.manifest)" >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          printf 'proven only by the validator on schai:\n\n' >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          while IFS=$'\t' read -r suite reason; do
            case "${suite}" in ''|\#*) continue ;; esac
            printf -- '- `%s` — %s\n' "${suite}" "${reason}" >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          done < tests/host-only.manifest
          printf '\n'
          grep -cvE '^#|^$' tests/host-only.manifest \
            | xargs printf 'host-only suites declared: %s\n'

      - name: Static repository assertions
        run: bash tests/test-static.sh

      - name: Static documentation assertions
        run: bash tests/test-docs-static.sh

      # Install PyYAML from a pinned, hash-verified requirements file so the
      # model validator does not depend on whatever PyPI serves that day.
      # PIP_BREAK_SYSTEM_PACKAGES is set because Ubuntu 24.04 marks its system
      # Python as externally managed (PEP 668); it is a no-op where that marker
      # is absent.
      - name: Install pinned CI Python dependencies
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: python3 -m pip install --require-hashes -r requirements-ci.txt

      # The platform model validator degrades to structure-only checks when
      # PyYAML is absent. Fail loudly instead, so CI can never report green
      # while silently skipping reference resolution and field validation.
      - name: Verify PyYAML is available
        run: |
          python3 -c 'import yaml' || {
            echo "PyYAML is required for platform model structural validation." >&2
            exit 1
          }

      - name: Platform model validation
        run: bash tests/test-platform-model.sh

      # Repository-only: reads model files and reports findings. No network
      # access, SSH, subprocess collection, model mutation, or remediation.
      - name: Evidence and drift definition validation
        run: python3 tools/platform_model/validate_evidence.py --root platform-model

      # A standard YAML loader keeps only the last value for a repeated key, so
      # an earlier ontology definition disappears during parsing and nothing
      # notices. Parsed here with a duplicate-rejecting loader that fails
      # closed and names the file, key, and line. Sweeps every tracked YAML
      # file, not only the ontology.
      - name: Ontology duplicate-key validation
        run: |
          python3 tools/platform_model/validate_ontology.py --root platform-model
          python3 tools/platform_model/validate_ontology.py --root . --all-tracked

      - name: Evidence validator behaviour tests
        run: bash tests/test-evidence-validator.sh

      # Declarative Evidence fingerprint and the S0 ceremony. Fixture-only.
      - name: Evidence fingerprint and S0 ceremony tests
        run: bash tests/test-evidence-fingerprint.sh

      # Repository-only: reads manifests and imports plugin modules to confirm
      # they implement the contract. No network access, no SSH, no subprocess,
      # no filesystem write, and no live collection.
      - name: Collector plugin validation
        run: python3 tools/collectors/validate_plugins.py --root .

      - name: Collector framework tests
        run: bash tests/test-collector-framework.sh

      # Fixture-driven. Builds temporary git repositories and Compose files in
      # a temp directory; contacts no host, uses no SSH, starts no container.
      # The real repository Compose files are rendered read-only via
      # `docker compose config`, which the Compose validation step already does.
      - name: Initial read-only collector tests
        run: bash tests/test-initial-collectors.sh

      # Every store root the suite creates lives in a temp directory and is
      # removed. Nothing is written into the repository, no production path is
      # touched, and no network, SSH, Docker runtime, or secret is involved.
      - name: Knowledge orchestrator tests
        run: bash tests/test-knowledge-orchestrator.sh

      # Asserts local tooling stays in parity with this workflow: pinned tool
      # versions, no suite skipping silently, and no dev script mutating the
      # host. Uses temp directories and a PYTHONPATH shim; installs nothing.
      - name: Developer experience tests
        run: bash tests/test-developer-experience.sh

      # Fails the build if a run left generated records behind under
      # platform-model. The suite asserts this itself; this is the backstop for
      # anything else that might write there.
      - name: Confirm no generated records were committed
        run: |
          if git ls-files 'platform-model/evidence/EVID-*' \
                          'platform-model/verifications/VER-*' \
                          'platform-model/knowledge-events/MEM-*' \
                          'platform-model/observations/OBS-*' \
                          'platform-model/**/SNAP-*' \
                          'platform-model/**/TWIN-*' \
                          'platform-model/**/INTEG-*' \
                          'platform-model/**/RECOV-*' \
                          'platform-model/**/EXP-*' \
                          'platform-model/**/WINDOW-*' \
                          'platform-model/**/BASE-*' \
                          'platform-model/**/OCC-*' \
                          'platform-model/**/SERIES-*' \
                          'platform-model/**/PAT-*' \
                          'platform-model/**/TL-*' | grep -q .; then
            echo "Generated runtime records must not be committed under platform-model." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain platform-model)" ]; then
            echo "The test suite modified platform-model; it must be read-only to tests." >&2
            git status --porcelain platform-model >&2
            exit 1
          fi

      # Fixture-driven. Builds temporary evidence and integrity stores in a temp
      # directory; contacts no host, starts no container, and executes no
      # recovery. Asserts the engine cannot execute one at all.
      - name: Operational integrity tests
        run: bash tests/test-operational-integrity.sh

      # Fixture-driven. Builds temporary evidence and experience stores in a
      # temp directory; contacts no host, runs no subprocess, and holds no
      # model. Asserts the engine cannot predict, learn, or act.
      - name: Experience engine tests
        run: bash tests/test-experience-engine.sh

      # Fixture-driven. Builds temporary evidence and occurrence stores in a
      # temp directory; contacts no host, runs no subprocess, and makes no
      # forward-looking claim. Asserts the engine cannot predict.
      - name: Occurrence timeline tests
        run: bash tests/test-occurrence-timeline.sh

      # Drives a fake transport exclusively. The one component that could reach
      # a host — SSHRemoteTransport — is tested by inspecting the argv it would
      # build, and is never executed. No DNS lookup, no SSH, no network, no
      # credential read, no host-key enrollment, no model mutation.
      - name: Remote collector tests
        run: bash tests/test-remote-collectors.sh

      # Architecture only: ADR-0011, four immutable schemas, ontology, and
      # documentation. Asserts the specification is complete and that no trust
      # engine, enrollment, certificate handling, or approval workflow exists.
      - name: Trust plane tests
        run: bash tests/test-trust-plane.sh

      # Builds synthetic trust stores in temporary directories and destroys
      # them. No network, no SSH, no subprocess from library code, no Docker,
      # no secrets file of any kind, and no store inside the repository.
      - name: Trust runtime tests
        run: bash tests/test-trust-runtime.sh

      # Trust Evidence identity integrity and read-only decision rehearsal.
      - name: Trust decision preflight tests
        run: bash tests/test-trust-decision-preflight.sh

      # The one-time root establishment lineage repair ADR-0014 specifies.
      # Reconstructs the pre-fix ceremony shape in temporary directories; it
      # never copies or writes a production store.
      - name: Trust root lineage backfill tests
        run: bash tests/test-trust-root-lineage-backfill.sh

      # Builds synthetic fabric records in memory and destroys nothing because
      # it writes nothing. No network, no SSH, no subprocess from library code,
      # no Docker, no secrets file of any kind, and no store of any kind.
      - name: Fabric runtime tests
        run: bash tests/test-fabric-runtime.sh

      # The governed resource vocabulary and its one satisfaction rule. Pure
      # functions over mappings: no store, no record, no identifier.
      - name: Fabric resource semantics tests
        run: bash tests/test-fabric-resources.sh

      # Read-only preflight for governed Fabric writes. Fixture-only.
      - name: Fabric write preflight tests
        run: bash tests/test-fabric-preflight.sh

      # `manifest_reference` from the approved decision body to the staged
      # tree. Fixture-only: temporary stores, artifact roots and staging roots.
      - name: Fabric package manifest reference tests
        run: bash tests/test-fabric-package-manifest.sh

      # CHOST admission vocabulary and read-only trust rehearsal. Fixture-only.
      - name: Fabric host admission tests
        run: bash tests/test-fabric-host-admission.sh

      # The trusted deployment Evidence authority and the read-only cross-plane
      # resolution that binds an EVID to a claimed profile. Fixture-only.
      - name: Fabric evidence authority tests
        run: bash tests/test-fabric-evidence-authority.sh

      # G11-A: an instance is bound to the advertisement that admitted it, the
      # admitted host must be a permitted target of the composed scope, and a
      # renewal states which claim it replaces without touching it.
      # Fixture-only: temporary Fabric and Trust stores.
      - name: Fabric G11-A integrity tests
        run: bash tests/test-fabric-g11-integrity.sh

      # G11-H: a first instance admission must be rehearsable, and admission
      # must consume the current advertisement rather than merely a fresh one.
      # Fixture-only: temporary Fabric and Trust stores.
      - name: Fabric instance admission integrity tests
        run: bash tests/test-fabric-instance-admission-integrity.sh

      # G11-AG: an admission must not claim authority past the advertisement it
      # depends on. Without the bound, [valid_until, admitted_until) is an R17
      # tail -- lifecycle-admitted with ELIG-7 open while ELIG-6 refuses.
      # Fixture-only: temporary Fabric and Trust stores.
      - name: Fabric admission dependency bound tests
        run: bash tests/test-fabric-admission-dependency-bound.sh

      # G11-K: create-route must be rehearsable before the first production
      # route is written. Fixture-only: temporary Fabric and Trust stores.
      - name: Fabric route preflight tests
        run: bash tests/test-fabric-route-preflight.sh

      # A route may supersede only the current head of its chain, and a class
      # may have only one current route. Fixture-only.
      - name: Fabric route head tests
        run: bash tests/test-fabric-route-head.sh

      # G11-N: register-advertisement must be rehearsable in both shapes before
      # the CADV renewal ceremony. Fixture-only.
      - name: Fabric advertisement preflight tests
        run: bash tests/test-fabric-advertisement-preflight.sh

      # G11-B: the installed Capability Runtime must satisfy its Fabric
      # dependency from the installed surface, not from a checkout. Builds a
      # disposable installation root; skips cleanly where none is installed.
      - name: Fabric installed dependency closure tests
        run: bash tests/test-fabric-runtime-install-closure.sh

      # ENG-0005 Track A: the Capability Runtime's persistence foundation, and
      # the permanent backstop asserting the package executes nothing. Builds
      # temporary stores only. No network, no Docker, no capability execution.
      - name: Capability runtime tests
        run: bash tests/test-capability-runtime.sh

      # Drives the trust gateway directly. Asserts one decision point and that
      # every migrated allow and deny is unchanged from v0.9.3.
      - name: Trust migration tests
        run: bash tests/test-trust-migration.sh

      # Architecture only: ADR-0012, eight immutable schemas, ontology, and
      # documentation. Asserts the specification is complete and that no fabric
      # engine, registry service, scheduler, placement, or execution exists.
      - name: Capability fabric tests
        run: bash tests/test-capability-fabric.sh
      - name: Invocation operation authority
        run: bash tests/test-capability-invocation-operation-authority.sh
      - name: Invoke current eligibility
        run: bash tests/test-capability-invoke-current-eligibility.sh

      # The rehearsal that keeps a first invocation from costing an identity to
      # discover it would be refused. Fixture-only.
      - name: Invoke preflight
        run: bash tests/test-capability-invoke-preflight.sh
      - name: Generation-12 packaging
        run: bash tests/test-capability-execution-generation12-packaging.sh
      - name: Generation-12 installer
        run: bash tests/test-capability-execution-generation12-installer.sh

      # Architecture only: ADR-0013, six immutable schemas, ontology, and
      # documentation. Asserts the specification is complete and that no health
      # engine, collector, probe, heartbeat receiver, evaluation loop,
      # rerouting, drain, quarantine, or remediation exists.
      - name: Capability health tests
        run: bash tests/test-capability-health.sh

      # ENG-0005 first adapter, increments T1-T5. One suite per increment, each
      # carrying the purity or authority backstop for the modules that increment
      # added. Pure or descriptor-scoped: no host state, no Podman, no network.
      - name: Capability execution types tests
        run: bash tests/test-capability-execution.sh

      - name: Capability execution canonical JSON tests
        run: bash tests/test-capability-execution-canonical-json.sh

      - name: Capability execution payload tests
        run: bash tests/test-capability-execution-payload.sh

      - name: Capability execution implementation authority tests
        run: bash tests/test-capability-execution-implementation-authority.sh

      - name: Capability execution mutation tests
        run: bash tests/test-capability-execution-mutation.sh

      - name: Capability execution capacity tests
        run: bash tests/test-capability-execution-capacity.sh

      # Forks real processes against a pipe barrier: the two-slot ceiling only
      # means something if it holds under a genuine race.
      - name: Capability execution capacity race tests
        run: bash tests/test-capability-execution-capacity-race.sh

      - name: Capability execution handoff tests
        run: bash tests/test-capability-execution-handoff.sh

      - name: Capability execution profile tests
        run: bash tests/test-capability-execution-profile.sh

      - name: Capability execution protocol tests
        run: bash tests/test-capability-execution-protocol.sh

      # Policy logic only, run as the ordinary CI user. Installs no helper,
      # touches no sudoers file, and requires no privilege.
      - name: Capability execution helper policy tests
        run: bash tests/test-capability-execution-helper-policy.sh

      # G11-AH: the coordinator identity is read from root-owned deployment
      # authority rather than compiled in. Policy only; no privilege.
      - name: Capability execution coordinator authority tests
        run: bash tests/test-capability-execution-coordinator-authority.sh

      # Privileged action layer, driven through an injected backend. Changes no
      # credentials and requires no privilege.
      - name: Capability execution transition action tests
        run: bash tests/test-capability-execution-transition-action.sh

      # Sealed profile transport: real memfds, real seals, and one real execve
      # into a controlled child. No credential change and no privilege.
      - name: Capability execution profile transport tests
        run: bash tests/test-capability-execution-profile-transport.sh

      # The create_argv authority gate: profile policy re-derivation, runtime
      # contracts, image presence through an injected seam, and the payload
      # and package commitments. Builds argv and executes nothing.
      - name: Capability execution authority gate tests
        run: bash tests/test-capability-execution-authority-gate.sh

      # The worker-owned invocation snapshot: real filesystem mutation against
      # fixture trees, proving the container-consumed material is independent
      # of the coordinator handoff. No privilege, no container, no Podman.
      - name: Capability execution snapshot tests
        run: bash tests/test-capability-execution-snapshot.sh

      # Generation-5 installer, driven against throwaway fixture trees only:
      # failure injected at every commit position, every interrupted
      # transaction replayed. Installs nothing and needs no privilege.
      - name: Capability execution generation-5 installer tests
        run: bash tests/test-capability-execution-generation5-installer.sh

      # Generation-6 installer: one NEW runtime object, so rollback removes
      # rather than restores. Fixture trees only -- no tmpfiles fragment is
      # installed, no snapshot root is created, systemd-tmpfiles never runs.
      - name: Capability execution generation-6 installer tests
        run: bash tests/test-capability-execution-generation6-installer.sh

      # The read-only G5 ceremony preflight. Fixture trees only: it builds no
      # image, creates no authority state, and invokes no container runtime.
      - name: Capability execution G5 preflight tests
        run: bash tests/test-capability-execution-g5-preflight.sh

      # The G5 ceremony and its trust boundary: pinned-object materialisation,
      # isolated execution, and each isolation property proven by attack.
      - name: Capability execution G5 ceremony tests
        run: bash tests/test-capability-execution-g5-ceremony.sh

      # Cosign trust and Chainguard SPDX attestation semantics, against
      # synthetic DSSE envelopes. No network, no install, no approval.
      - name: Capability execution G5 supply chain tests
        run: bash tests/test-capability-execution-g5-supply-chain.sh

      # Base-image selection by governed version, against recorded history
      # and recorded SPDX. No network, no pull, no approval.
      - name: Capability execution G5 discovery tests
        run: bash tests/test-capability-execution-g5-discovery.sh

      # The production build context: pinned git objects onto root-owned
      # ancestry the coordinator cannot touch. No image build, no Podman.
      - name: Capability execution G5 build context tests
        run: bash tests/test-capability-execution-g5-build-context.sh

      # Mutation eligibility derived from ruled evidence, and the
      # bootstrap/genesis/admission chain over fixture namespaces.
      - name: Capability execution G5 authority tests
        run: bash tests/test-capability-execution-g5-authority.sh

      # Worker driven through a fake backend: no Podman, no subprocess, no
      # container. Real execution is gate G6.
      - name: Capability execution lifecycle tests
        run: bash tests/test-capability-execution-lifecycle.sh

      - name: Capability execution terminal classification tests
        run: bash tests/test-capability-execution-terminal.sh

      # Output collection over trees built in a temporary directory. Reads and
      # hashes; creates, deletes, and executes nothing.
      - name: Capability execution collector tests
        run: bash tests/test-capability-execution-collector.sh

      # The result-content authority a capability contract's
      # `response_shape.content` references. Judges a decoded mapping only: no
      # descriptor, no path, no bytes, no clock.
      - name: Capability execution result content tests
        run: bash tests/test-capability-execution-result-content.sh

      # Runtime outcome -> governed contract failure mode, and the closure
      # invariant over every reachable terminal disposition.
      - name: Capability execution contract outcome tests
        run: bash tests/test-capability-execution-contract-outcome.sh

      # The governed boundary-verification package, driven through the released
      # package, payload, collector, result-content, and contract-outcome
      # authorities against fixture paths. Creates no container, opens no
      # governance store, and declares no CPKG record.
      - name: Capability execution verification package tests
        run: bash tests/test-capability-execution-verification-package.sh

      # Quarantine over a temporary store. Deletes nothing; v1 has no deletion
      # path at all.
      - name: Capability execution quarantine tests
        run: bash tests/test-capability-execution-quarantine.sh

      # Cleanup and recovery classification. Deletes only inside its own
      # fixture and contacts no runtime.
      - name: Capability execution cleanup tests
        run: bash tests/test-capability-execution-cleanup.sh

      # Administrative dispatch and CADM with an injected backend. Installs no
      # helper and authenticates nothing.
      - name: Capability execution administrative tests
        run: bash tests/test-capability-execution-admin.sh

      # The adapter driven through an injected backend. No Podman, no
      # container, no provisioned runtime.
      - name: Capability execution adapter tests
        run: bash tests/test-capability-execution-adapter.sh

      # Static image-definition validation. Builds nothing and pulls nothing.
      - name: Capability execution image definition tests
        run: bash tests/test-capability-execution-image.sh

      # Output containment policy and the privileged quota source. Sets no
      # quota and installs nothing.
      - name: Capability execution output quota tests
        run: bash tests/test-capability-execution-quota.sh

      # G5 offline authority bootstrap: counters, lifecycle lock, genesis.
      # Hermetic against temporary roots; creates no production authority path.
      - name: Capability implementation-authority bootstrap tests
        run: bash tests/test-capability-authority-bootstrap.sh

      # G5 ordinary admission transaction and provisioning evidence.
      # Hermetic; builds no image and creates no production authority path.
      - name: Capability implementation admission tests
        run: bash tests/test-capability-authority-admission.sh

      # G5 pending-disposition ceremonies. Hermetic; no production path.
      - name: Capability pending disposition tests
        run: bash tests/test-capability-authority-disposition.sh

      # G5 coordinator authority resolution. Read-only and hermetic.
      - name: Capability authority resolution tests
        run: bash tests/test-capability-authority-resolution.sh

      # G4 provisioning artifacts. Installs nothing and mounts nothing.
      - name: Capability execution provisioning artifact tests
        run: bash tests/test-capability-execution-provisioning.sh

      # G11-AI: image-export identity handling against the rendering Podman
      # actually emits. Invokes no Podman and touches no container store.
      - name: Capability execution G11-AI image export identity tests
        run: bash tests/test-capability-execution-image-export.sh

      # G11-AJ: the governed container identity and the chain that must agree
      # about it. Static and unprivileged.
      - name: Capability execution container identity tests
        run: bash tests/test-capability-execution-container-identity.sh

      # G11-AK: what a runtime observation may claim to have seen.
      - name: Capability execution runtime observation tests
        run: bash tests/test-capability-execution-runtime-observation.sh

      # G11-AK: the governed Podman backend. No Podman runs here.
      - name: Capability execution Podman backend tests
        run: bash tests/test-capability-execution-podman-backend.sh

      # G11-AK: the privileged helper's halves must agree about the worker
      # target. Source-level; the installed state is reported, not enforced.
      - name: Capability execution helper coherence tests
        run: bash tests/test-capability-execution-helper-coherence.sh

      # G11-AL: the worker entrypoint's backend binding and privilege ordering.
      - name: Capability execution worker binding tests
        run: bash tests/test-capability-execution-worker-binding.sh

      # G11-AM: full isolated invoke through to a real container. Host-only;
      # reports HOST_ONLY_SKIP on a runner with no production layout.
      # G11-AN: the terminal result contract. Hermetic.
      - name: Capability terminal result contract tests
        run: bash tests/test-capability-result-contract.sh

      # G11-AO: adapter identity on the invocation record, and interrupted
      # semantics that depend on it. Hermetic.
      - name: Capability adapter binding tests
        run: bash tests/test-capability-adapter-binding.sh

      # G11-AP: supervisor preconditions -- descriptor topology, protocol state
      # machine, and the authority split. Static.
      - name: Capability execution supervision precondition tests
        run: bash tests/test-capability-execution-supervision-preconditions.sh

      # G11-AQ: governed container reconciliation. Host-only; reports
      # HOST_ONLY_SKIP where there is no Podman or exported archive.
      # G11-AS: the deployment execution identity authority, and the privileged
      # reconciliation entrypoint it made buildable. Both static: fixture
      # authorities, injected account resolvers, injected credential recorders.
      - name: Capability execution identity authority tests
        run: bash tests/test-capability-execution-identity-authority.sh

      # G11-AT: coordinator supervision, recovery enumeration and the
      # readiness gate. Forked children and pipes only.
      - name: Capability execution supervision tests
        run: bash tests/test-capability-execution-supervision.sh

      - name: Capability execution reconcile entrypoint tests
        run: bash tests/test-capability-execution-reconcile-entrypoint.sh

      - name: Capability execution container reconciliation tests
        run: bash tests/test-capability-execution-reconciliation.sh

      - name: Capability invoke execution end-to-end tests
        run: bash tests/test-capability-invoke-execution-e2e.sh

      # G11-AT: the supervised chain against real containers. Host-only;
      # reports HOST_ONLY_SKIP where there is no Podman or exported archive.
      - name: Capability supervised execution end-to-end tests
        run: bash tests/test-capability-supervised-execution-e2e.sh

      # G6.1A: the trusted-runtime installation ceremony. Transactional
      # create-once publication of five new objects onto a verified
      # generation-6 baseline, driven against throwaway fixture trees only.
      - name: Capability execution generation-7 (G6.1A) ceremony tests
        run: bash tests/test-capability-execution-generation7-installer.sh

      # G6.1: the privileged chain up to, and short of, container execution.
      # The verification-only worker runs the same shared gate production runs
      # and emits a proof instead of creating a container. Installs no sudoers,
      # invokes no sudo, performs no transition, runs no container runtime.
      - name: Capability execution G6.1 verification tests
        run: bash tests/test-capability-execution-g61-verification.sh

      # The coordinator execution-authorization bridge: execution-prepared to a
      # verifiable handoff, and no further. Elevates nothing, executes nothing,
      # and contacts no container runtime.
      - name: Capability execution launch bridge tests
        run: bash tests/test-capability-execution-launch-bridge.sh

      # The Generation-8 installation ceremony, fixture-only. Installs nothing,
      # writes no sudoers, invokes no helper, contacts no container runtime.
      - name: Capability execution generation-8 installer tests
        run: bash tests/test-capability-execution-generation8-installer.sh

      # The governed S5 operator surface, fixture-only. Elevates nothing,
      # seeds no governance store, contacts no container runtime.
      - name: Capability execution launch CLI tests
        run: bash tests/test-capability-execution-launch-cli.sh

      # The Generation-9 installation ceremony, fixture-only.
      - name: Capability execution generation-9 installer tests
        run: bash tests/test-capability-execution-generation9-installer.sh

      # The Generation-10 installation ceremony, fixture-only.
      - name: Capability execution generation-10 installer tests
