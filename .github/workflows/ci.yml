# Primary validation workflow. Automates the SAME checks a developer runs
# locally (see docs/development/local-validation.md) — it invents no CI-only
# behavior. Every step here is reproducible on a workstation.
name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# Cancel superseded runs for the same ref to avoid duplicate work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Shell syntax check (scripts and tests)
        run: |
          bash -n scripts/*.sh
          bash -n tests/*.sh

      - name: Static repository assertions
        run: bash tests/test-static.sh

      - name: Static documentation assertions
        run: bash tests/test-docs-static.sh

      # Install PyYAML from a pinned, hash-verified requirements file so the
      # model validator does not depend on whatever PyPI serves that day.
      # PIP_BREAK_SYSTEM_PACKAGES is set because Ubuntu 24.04 marks its system
      # Python as externally managed (PEP 668); it is a no-op where that marker
      # is absent.
      - name: Install pinned CI Python dependencies
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: python3 -m pip install --require-hashes -r requirements-ci.txt

      # The platform model validator degrades to structure-only checks when
      # PyYAML is absent. Fail loudly instead, so CI can never report green
      # while silently skipping reference resolution and field validation.
      - name: Verify PyYAML is available
        run: |
          python3 -c 'import yaml' || {
            echo "PyYAML is required for platform model structural validation." >&2
            exit 1
          }

      - name: Platform model validation
        run: bash tests/test-platform-model.sh

      # Repository-only: reads model files and reports findings. No network
      # access, SSH, subprocess collection, model mutation, or remediation.
      - name: Evidence and drift definition validation
        run: python3 tools/platform_model/validate_evidence.py --root platform-model

      # A standard YAML loader keeps only the last value for a repeated key, so
      # an earlier ontology definition disappears during parsing and nothing
      # notices. Parsed here with a duplicate-rejecting loader that fails
      # closed and names the file, key, and line. Sweeps every tracked YAML
      # file, not only the ontology.
      - name: Ontology duplicate-key validation
        run: |
          python3 tools/platform_model/validate_ontology.py --root platform-model
          python3 tools/platform_model/validate_ontology.py --root . --all-tracked

      - name: Evidence validator behaviour tests
        run: bash tests/test-evidence-validator.sh

      # Repository-only: reads manifests and imports plugin modules to confirm
      # they implement the contract. No network access, no SSH, no subprocess,
      # no filesystem write, and no live collection.
      - name: Collector plugin validation
        run: python3 tools/collectors/validate_plugins.py --root .

      - name: Collector framework tests
        run: bash tests/test-collector-framework.sh

      # Fixture-driven. Builds temporary git repositories and Compose files in
      # a temp directory; contacts no host, uses no SSH, starts no container.
      # The real repository Compose files are rendered read-only via
      # `docker compose config`, which the Compose validation step already does.
      - name: Initial read-only collector tests
        run: bash tests/test-initial-collectors.sh

      # Every store root the suite creates lives in a temp directory and is
      # removed. Nothing is written into the repository, no production path is
      # touched, and no network, SSH, Docker runtime, or secret is involved.
      - name: Knowledge orchestrator tests
        run: bash tests/test-knowledge-orchestrator.sh

      # Asserts local tooling stays in parity with this workflow: pinned tool
      # versions, no suite skipping silently, and no dev script mutating the
      # host. Uses temp directories and a PYTHONPATH shim; installs nothing.
      - name: Developer experience tests
        run: bash tests/test-developer-experience.sh

      # Fails the build if a run left generated records behind under
      # platform-model. The suite asserts this itself; this is the backstop for
      # anything else that might write there.
      - name: Confirm no generated records were committed
        run: |
          if git ls-files 'platform-model/evidence/EVID-*' \
                          'platform-model/verifications/VER-*' \
                          'platform-model/knowledge-events/MEM-*' \
                          'platform-model/observations/OBS-*' \
                          'platform-model/**/SNAP-*' \
                          'platform-model/**/TWIN-*' \
                          'platform-model/**/INTEG-*' \
                          'platform-model/**/RECOV-*' \
                          'platform-model/**/EXP-*' \
                          'platform-model/**/WINDOW-*' \
                          'platform-model/**/BASE-*' \
                          'platform-model/**/OCC-*' \
                          'platform-model/**/SERIES-*' \
                          'platform-model/**/PAT-*' \
                          'platform-model/**/TL-*' | grep -q .; then
            echo "Generated runtime records must not be committed under platform-model." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain platform-model)" ]; then
            echo "The test suite modified platform-model; it must be read-only to tests." >&2
            git status --porcelain platform-model >&2
            exit 1
          fi

      # Fixture-driven. Builds temporary evidence and integrity stores in a temp
      # directory; contacts no host, starts no container, and executes no
      # recovery. Asserts the engine cannot execute one at all.
      - name: Operational integrity tests
        run: bash tests/test-operational-integrity.sh

      # Fixture-driven. Builds temporary evidence and experience stores in a
      # temp directory; contacts no host, runs no subprocess, and holds no
      # model. Asserts the engine cannot predict, learn, or act.
      - name: Experience engine tests
        run: bash tests/test-experience-engine.sh

      # Fixture-driven. Builds temporary evidence and occurrence stores in a
      # temp directory; contacts no host, runs no subprocess, and makes no
      # forward-looking claim. Asserts the engine cannot predict.
      - name: Occurrence timeline tests
        run: bash tests/test-occurrence-timeline.sh

      # Drives a fake transport exclusively. The one component that could reach
      # a host — SSHRemoteTransport — is tested by inspecting the argv it would
      # build, and is never executed. No DNS lookup, no SSH, no network, no
      # credential read, no host-key enrollment, no model mutation.
      - name: Remote collector tests
        run: bash tests/test-remote-collectors.sh

      # Architecture only: ADR-0011, four immutable schemas, ontology, and
      # documentation. Asserts the specification is complete and that no trust
      # engine, enrollment, certificate handling, or approval workflow exists.
      - name: Trust plane tests
        run: bash tests/test-trust-plane.sh

      # Builds synthetic trust stores in temporary directories and destroys
      # them. No network, no SSH, no subprocess from library code, no Docker,
      # no secrets file of any kind, and no store inside the repository.
      - name: Trust runtime tests
        run: bash tests/test-trust-runtime.sh

      # Builds synthetic fabric records in memory and destroys nothing because
      # it writes nothing. No network, no SSH, no subprocess from library code,
      # no Docker, no secrets file of any kind, and no store of any kind.
      - name: Fabric runtime tests
        run: bash tests/test-fabric-runtime.sh

      # Drives the trust gateway directly. Asserts one decision point and that
      # every migrated allow and deny is unchanged from v0.9.3.
      - name: Trust migration tests
        run: bash tests/test-trust-migration.sh

      # Architecture only: ADR-0012, eight immutable schemas, ontology, and
      # documentation. Asserts the specification is complete and that no fabric
      # engine, registry service, scheduler, placement, or execution exists.
      - name: Capability fabric tests
        run: bash tests/test-capability-fabric.sh

      # Architecture only: ADR-0013, six immutable schemas, ontology, and
      # documentation. Asserts the specification is complete and that no health
      # engine, collector, probe, heartbeat receiver, evaluation loop,
      # rerouting, drain, quarantine, or remediation exists.
      - name: Capability health tests
        run: bash tests/test-capability-health.sh

      # Compose rendering uses the sanitized template only — never a real secret.
      # ubuntu-24.04 ships Docker Compose v2 (`docker compose`).
      - name: Validate Docker Compose configurations
        run: |
          docker compose --env-file ai/.env.example -f ai/compose.yaml config >/dev/null
          docker compose --env-file ai/ollama/.env.example -f ai/ollama/compose.yaml config >/dev/null
          docker compose --env-file ai/litellm/.env.example -f ai/litellm/compose.yaml config >/dev/null
